name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      # The runner has no display, and plasma-apply-colorscheme /
      # plasma-apply-desktoptheme abort when Qt falls through to xcb. The
      # render session overrides this to `wayland` for its own clients, so
      # the nested KWin session still gets a Wayland client.
      QT_QPA_PLATFORM: offscreen
      # The runner has no GPU; KWin's virtual backend otherwise tries Zink,
      # finds no Vulkan driver and cannot create its EGL screen.
      LIBGL_ALWAYS_SOFTWARE: '1'
      MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
    strategy:
      fail-fast: false
      matrix:
        # The workflow pins Python 3.13, the interpreter the project is
        # developed on (the user's 2026-10-30 parity decision: local parity
        # with the matrix is possible because it names exactly one version).
        # The Makefile's own run-time floor check keeps refusing a Python
        # older than the version named in Makefile's usage line; the workflow
        # no longer exercises a second interpreter, and that trade-off is the
        # user's accepted decision.
        python-version: ['3.13']
    steps:
      # Third-party actions are pinned to the full commit SHA their version
      # tag named when the pin was recorded (2026-10-31, resolved from the
      # tag with `git ls-remote`), with the tag kept as a trailing comment:
      # a retagged `v4`/`v5` tag would otherwise run new, unreviewed code
      # inside this workflow on every push and pull request.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the Plasma render tools
        run: |
          set -e
          # Ubuntu 26.04 ships org.kde.plasma.calculator as a Plasma applet
          # plugin; 24.04 ships it as a package directory. Either satisfies
          # the applet render, which opens the applet by id.
          has_calculator_applet() {
            [ -e /usr/share/plasma/plasmoids/org.kde.plasma.calculator/metadata.json ] || \
              compgen -G '/usr/lib/*/qt6/plugins/plasma/applets/org.kde.plasma.calculator.so' >/dev/null
          }
          if command -v dbus-run-session >/dev/null && \
             command -v kwin_wayland >/dev/null && \
             command -v plasmawindowed >/dev/null && \
             command -v plasma-apply-colorscheme >/dev/null && \
             command -v spectacle >/dev/null && \
             command -v kdialog >/dev/null && \
             command -v zenity >/dev/null && \
             has_calculator_applet; then
            : # The render tools are already available in this runner.
          else
            sudo apt-get update
            # The names below are grounded on the Ubuntu runners' release
            # (noble records each on launchpad.net/ubuntu/noble/amd64/):
            # `dbus` provides dbus-run-session, `kwin-wayland` kwin_wayland,
            # `plasma-workspace` both plasmawindowed and
            # plasma-apply-colorscheme, `plasma-widgets-addons` the
            # org.kde.plasma.calculator applet the applet render opens, and
            # `libgl1-mesa-dri` the llvmpipe EGL driver the virtual KWin
            # session needs on the GPU-less runner; `kdialog` provides the
            # dialog render's three kdialog clients and `zenity` the GTK 4
            # dialog render's client.
            sudo apt-get install -y --no-install-recommends \
              dbus kwin-wayland plasma-workspace plasma-widgets-addons \
              libgl1-mesa-dri libtesseract5 tesseract-ocr-eng \
              kdialog zenity
            # Ubuntu 26.04 renamed
            # the screenshot package from `spectacle` to `kde-spectacle`;
            # the installed binary stayed `/usr/bin/spectacle`. Select the
            # name the runner's index provides so the 24.04 and 26.04
            # images both install, and the by-name verification below
            # still checks the binary.
            if apt-cache show spectacle >/dev/null 2>&1; then
              spectacle_package=spectacle
            else
              spectacle_package=kde-spectacle
            fi
            sudo apt-get install -y --no-install-recommends \
              "$spectacle_package"
            # Ubuntu 26.04 splits the Aurorae decoration engine out of
            # kwin-common into kwin-style-aurorae; the renderer's kwinrc
            # selects org.kde.kwin.aurorae and KWin refuses to start the
            # session without the plugin. Install the name each release
            # provides.
            if apt-cache show kwin-style-aurorae >/dev/null 2>&1; then
              aurorae_package=kwin-style-aurorae
            else
              aurorae_package=kwin-common
            fi
            sudo apt-get install -y --no-install-recommends \
              "$aurorae_package"
            # Newer Debian-family releases split dbus-run-session out of the
            # 'dbus' package; cover that layout too.
            command -v dbus-run-session >/dev/null || \
              sudo apt-get install -y --no-install-recommends dbus-daemon
          fi
          for tool in dbus-run-session kwin_wayland plasmawindowed \
                      plasma-apply-colorscheme spectacle kdialog zenity; do
            command -v "$tool" >/dev/null \
              || { echo "render tool missing after install: $tool" >&2; exit 1; }
          done
          # The applet render opens org.kde.plasma.calculator; without it the
          # client never paints and the render times out instead of failing
          # at the install step that was meant to provide it.
          has_calculator_applet \
            || { echo "calculator applet missing after install" >&2; exit 1; }
      - run: make check
      - run: make check-references
