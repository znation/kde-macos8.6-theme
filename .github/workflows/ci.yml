name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The Makefile refuses a Python older than 3.10; check that floor and
        # the version the project is developed on, so a newer-only API cannot
        # pass CI and then fail on a supported interpreter.
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the Plasma render tools
        run: |
          set -e
          if command -v dbus-run-session >/dev/null && \
             command -v kwin_wayland >/dev/null && \
             command -v plasmawindowed >/dev/null && \
             command -v plasma-apply-colorscheme >/dev/null && \
             command -v spectacle >/dev/null; then
            : # The render tools are already available in this runner.
          else
            sudo apt-get update
            # The names below are grounded on the Ubuntu runners' release (all
            # four packages record 200 on launchpad.net/ubuntu/noble/amd64/):
            # `dbus` provides dbus-run-session, `kwin-wayland` kwin_wayland,
            # and `plasma-workspace` both plasmawindowed and
            # plasma-apply-colorscheme; `spectacle` is the screenshot tool.
            sudo apt-get install -y --no-install-recommends \
              dbus kwin-wayland plasma-workspace spectacle
            # Newer Debian-family releases split dbus-run-session out of the
            # 'dbus' package; cover that layout too.
            command -v dbus-run-session >/dev/null || \
              sudo apt-get install -y --no-install-recommends dbus-daemon
          fi
          for tool in dbus-run-session kwin_wayland plasmawindowed \
                      plasma-apply-colorscheme spectacle; do
            command -v "$tool" >/dev/null \
              || { echo "render tool missing after install: $tool" >&2; exit 1; }
          done
      - run: make check
      - run: make check-references
