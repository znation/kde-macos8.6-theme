     from macos8.6-screenshots/aboutsystem_betawiki.png at x=11..22,
     y=29..40 and re-derived by tests/test_aurorae_decoration.py.

     The `inactive-center` group is the same box with its gradient face
     flattened to #CCCCCC and the #888888/#222222 outlines kept; the
     reference set has no inactive window, so the grey is KDE-required
     provenance. -->
