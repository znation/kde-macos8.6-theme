<!-- Mac OS 8.6 "Platinum" collapse (windowshade) widget.

     The reference's collapse box: aboutsystem_betawiki.png at x=343..354,
     y=29..40 and systemprofiler_betawiki.png at x=797..808, y=26..37,
     pixel-identical. It is the close box's gradient with an inner #222222
     glyph: two horizontal bars at frame-local y=5 and y=7 spanning
     x=2..10. Aurorae loads this file for the shade button. Re-derived by
     tests/test_aurorae_buttons.py.

     The canvas is 13x13: the 12x12 box plus the reference's 1px #FFFFFF
     highlight, a column at x=12 (y=1..12) and a row at y=12 (x=1..11),
     with #CCCCCC at (12,0) and (0,12). In the reference it sits just
     right of and below the box (aboutsystem_betawiki.png x=355 and y=41,
     systemprofiler_betawiki.png x=809).
     The `inactive-center` group draws those pixels #CCCCCC, the flat
     inactive title-bar field.

     The `inactive-center` group flattens the gradient face to #CCCCCC
     (KDE-required provenance: the reference set has no inactive window)
     and keeps the outlines and the collapse glyph. -->
