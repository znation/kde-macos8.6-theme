<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER: original mouse illustration pending user-approved artwork. -->
<!-- Mac OS 8.6 "Platinum" input-mouse icon.

     Our own 22x22 drawing in the Platinum palette: a black-outlined rounded
     mouse body with a #DDDDDD face, a white two-button band across the top, a
     black split between the buttons and a black scroll wheel below the band.
     Drawn for this theme, not traced from anyone's artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22">
  <!-- Body outline. -->
  <rect x="5" y="3" width="12" height="16" rx="6" fill="#000000"/>
  <!-- Body face. -->
  <rect x="6" y="4" width="10" height="14" rx="5" fill="#DDDDDD"/>
  <!-- Two-button band. -->
  <rect x="6" y="4" width="10" height="5" fill="#FFFFFF"/>
  <!-- Split between the buttons. -->
  <rect x="10" y="4" width="2" height="5" fill="#000000"/>
  <!-- Scroll wheel. -->
  <rect x="10" y="10" width="2" height="4" rx="1" fill="#000000"/>
</svg>
