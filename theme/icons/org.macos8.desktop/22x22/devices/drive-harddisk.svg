<?xml version="1.0" encoding="UTF-8"?>
<!-- Mac OS 8.6 "Platinum" hard-disk icon, 22x22 rendition.

     Our own 22x22 redraw in the Platinum palette: a #DDDDDD drive body with
     a 1px #000000 outline and the Platinum bevel (#FFFFFF top/left, #999999
     bottom/right), a white label plate and a black activity light. Drawn for
     this theme, not traced from Apple's artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22">
  <!-- Body outline and #DDDDDD face. -->
  <rect x="2" y="4" width="18" height="15" fill="#000000"/>
  <rect x="3" y="5" width="16" height="13" fill="#DDDDDD"/>
  <!-- Platinum bevel: white along the top and left, grey along the bottom
       and right. -->
  <rect x="3" y="5" width="16" height="2" fill="#FFFFFF"/>
  <rect x="3" y="5" width="1" height="13" fill="#FFFFFF"/>
  <rect x="3" y="17" width="16" height="1" fill="#999999"/>
  <rect x="18" y="5" width="1" height="13" fill="#999999"/>
  <!-- Front label plate. -->
  <rect x="4" y="10" width="8" height="4" fill="#000000"/>
  <rect x="5" y="11" width="6" height="2" fill="#FFFFFF"/>
  <!-- Activity light. -->
  <circle cx="15" cy="12" r="2" fill="#000000"/>
</svg>
