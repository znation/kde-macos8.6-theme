<!-- Platinum scanner icon, 22x22.

     Our own 22x22 drawing in the Platinum palette: a flatbed scanner
     seen from above, a landscape body with the 1px #000000 outline,
     #DDDDDD fill, white top row and left column and #999999 bottom row
     and right column, a closed lid holding a white glass strip with a
     black scan-lamp bar sweeping it, and a black status LED below the
     glass.
     Drawn for this theme, not traced from anyone's artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22">
  <rect x="1" y="4" width="20" height="15" fill="#000000"/>
  <rect x="2" y="5" width="18" height="13" fill="#DDDDDD"/>
  <rect x="2" y="5" width="18" height="1" fill="#FFFFFF"/>
  <rect x="2" y="5" width="1" height="13" fill="#FFFFFF"/>
  <rect x="2" y="17" width="18" height="1" fill="#999999"/>
  <rect x="19" y="5" width="1" height="13" fill="#999999"/>
  <rect x="4" y="7" width="12" height="5" fill="#000000"/>
  <rect x="5" y="8" width="10" height="3" fill="#FFFFFF"/>
  <rect x="6" y="9" width="8" height="1" fill="#000000"/>
  <rect x="3" y="14" width="2" height="2" fill="#000000"/>
</svg>
