<!-- Platinum modem icon, 22x22.

     Our own 22x22 drawing in the Platinum palette: an external modem
     seen from the front, with a black outline, a #DDDDDD body with a
     white top row and left column and a #999999 bottom row and right
     column, a telephone jack on the right, and a row of black
     indicator LEDs along the front.
     Drawn for this theme, not traced from anyone's artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22">
  <rect x="2" y="6" width="18" height="13" fill="#000000"/>
  <rect x="3" y="7" width="16" height="11" fill="#DDDDDD"/>
  <rect x="3" y="7" width="16" height="1" fill="#FFFFFF"/>
  <rect x="3" y="7" width="1" height="11" fill="#FFFFFF"/>
  <rect x="3" y="17" width="16" height="1" fill="#999999"/>
  <rect x="18" y="7" width="1" height="11" fill="#999999"/>
  <rect x="14" y="9" width="4" height="3" fill="#000000"/>
  <rect x="15" y="10" width="2" height="1" fill="#FFFFFF"/>
  <rect x="5" y="15" width="2" height="2" fill="#000000"/>
  <rect x="9" y="15" width="2" height="2" fill="#000000"/>
  <rect x="13" y="15" width="2" height="2" fill="#000000"/>
</svg>
