<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER: original removable-drive illustration pending user-approved artwork. -->
<!-- Platinum removable-media drive icon.

     Our own 22x22 drawing in the Platinum palette, not traced from anyone's
     artwork: the hard disk's body and bevel, with a media slot (black, with a
     white lower lip) and a black eject button in place of the label plate and
     light. -->
<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22">
  <!-- Body outline and #DDDDDD face. -->
  <rect x="2" y="4" width="18" height="15" fill="#000000"/>
  <rect x="3" y="5" width="16" height="13" fill="#DDDDDD"/>
  <!-- Platinum bevel: white along the top and left, grey along the bottom
       and right. -->
  <rect x="3" y="5" width="16" height="2" fill="#FFFFFF"/>
  <rect x="3" y="5" width="1" height="13" fill="#FFFFFF"/>
  <rect x="3" y="17" width="16" height="1" fill="#999999"/>
  <rect x="18" y="5" width="1" height="13" fill="#999999"/>
  <!-- Media slot with its white lower lip. -->
  <rect x="5" y="9" width="12" height="2" fill="#000000"/>
  <rect x="5" y="11" width="12" height="1" fill="#FFFFFF"/>
  <!-- Eject button. -->
  <rect x="13" y="14" width="4" height="1" fill="#000000"/>
</svg>
