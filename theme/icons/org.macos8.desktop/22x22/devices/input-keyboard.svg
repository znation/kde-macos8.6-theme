<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER: original keyboard illustration pending user-approved artwork. -->
<!-- Platinum keyboard icon, 22x22.

     Our own 22x22 drawing in the Platinum palette: a raised #DDDDDD face
     with a 1px #000000 body outline and the Platinum bevel (#FFFFFF top
     and left, #999999 bottom and right), three rows of black keys and a
     black space bar. Drawn for this theme, not traced from anyone's
     artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22">
  <!-- Body outline and #DDDDDD face. -->
  <rect x="1" y="5" width="20" height="12" fill="#000000"/>
  <rect x="2" y="6" width="18" height="10" fill="#DDDDDD"/>
  <!-- Platinum bevel: white along the top and left, grey along the bottom
       and right. -->
  <rect x="2" y="6" width="18" height="1" fill="#FFFFFF"/>
  <rect x="2" y="6" width="1" height="10" fill="#FFFFFF"/>
  <rect x="2" y="15" width="18" height="1" fill="#999999"/>
  <rect x="19" y="6" width="1" height="10" fill="#999999"/>
  <!-- Key rows. -->
  <rect x="3" y="8" width="2" height="1" fill="#000000"/>
  <rect x="6" y="8" width="2" height="1" fill="#000000"/>
  <rect x="9" y="8" width="2" height="1" fill="#000000"/>
  <rect x="12" y="8" width="2" height="1" fill="#000000"/>
  <rect x="15" y="8" width="4" height="1" fill="#000000"/>
  <rect x="3" y="10" width="2" height="1" fill="#000000"/>
  <rect x="6" y="10" width="2" height="1" fill="#000000"/>
  <rect x="9" y="10" width="2" height="1" fill="#000000"/>
  <rect x="12" y="10" width="2" height="1" fill="#000000"/>
  <rect x="15" y="10" width="4" height="1" fill="#000000"/>
  <rect x="3" y="12" width="2" height="1" fill="#000000"/>
  <rect x="6" y="12" width="2" height="1" fill="#000000"/>
  <rect x="9" y="12" width="2" height="1" fill="#000000"/>
  <rect x="12" y="12" width="2" height="1" fill="#000000"/>
  <rect x="15" y="12" width="4" height="1" fill="#000000"/>
  <!-- Space bar row. -->
  <rect x="3" y="14" width="2" height="1" fill="#000000"/>
  <rect x="6" y="14" width="10" height="1" fill="#000000"/>
  <rect x="17" y="14" width="2" height="1" fill="#000000"/>
</svg>
