<!-- Platinum film-camera icon, 22x22.

     Our own 22x22 drawing in the Platinum palette: two film reels on
     top, a raised body with a black outline and white/#999999 bevel,
     a black lens hood on the body's right edge, and two tripod legs
     below the body. Drawn for this theme, not traced from anyone's
     artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22">
  <circle cx="8" cy="6" r="3" fill="#000000"/>
  <circle cx="8" cy="6" r="1" fill="#DDDDDD"/>
  <circle cx="14" cy="6" r="3" fill="#000000"/>
  <circle cx="14" cy="6" r="1" fill="#DDDDDD"/>
  <rect x="3" y="9" width="14" height="9" fill="#000000"/>
  <rect x="4" y="10" width="12" height="7" fill="#DDDDDD"/>
  <rect x="4" y="10" width="12" height="1" fill="#FFFFFF"/>
  <rect x="4" y="10" width="1" height="7" fill="#FFFFFF"/>
  <rect x="4" y="16" width="12" height="1" fill="#999999"/>
  <rect x="15" y="10" width="1" height="7" fill="#999999"/>
  <rect x="17" y="11" width="3" height="3" fill="#000000"/>
  <rect x="6" y="18" width="2" height="2" fill="#000000"/>
  <rect x="13" y="18" width="2" height="2" fill="#000000"/>
</svg>
