<!-- Platinum flash-media icon, 22x22.

     Our own 22x22 drawing in the Platinum palette: an upright flash
     card standing on its contact pins, with a black outline, a
     #DDDDDD body with a white top row and left column and a #999999
     bottom row and right column, a white label plate outlined in
     black, and a row of three black contact pins clear of the bevel.
     Drawn for this theme, not traced from anyone's artwork. -->
