  <rect x="6" y="2" width="10" height="18" fill="#000000"/>
  <rect x="7" y="3" width="8" height="16" fill="#DDDDDD"/>
  <rect x="7" y="3" width="8" height="1" fill="#FFFFFF"/>
  <rect x="7" y="3" width="1" height="16" fill="#FFFFFF"/>
  <rect x="7" y="18" width="8" height="1" fill="#999999"/>
  <rect x="14" y="3" width="1" height="16" fill="#999999"/>
  <rect x="8" y="5" width="6" height="5" fill="#000000"/>
  <rect x="9" y="6" width="4" height="3" fill="#FFFFFF"/>
