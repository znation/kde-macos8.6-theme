<!-- Platinum tablet icon, 22x22.

     Our own 22x22 drawing in the Platinum palette: a graphics tablet
     seen from above, with a black outline, a #DDDDDD body with a
     white top row and left column and a #999999 bottom row and right
     column, a white drawing surface outlined in black on the left,
     and an upright pen on the right with a white barrel stripe and a
     tip notch below the barrel.
     Drawn for this theme, not traced from anyone's artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22">
  <rect x="1" y="4" width="20" height="15" fill="#000000"/>
  <rect x="2" y="5" width="18" height="13" fill="#DDDDDD"/>
  <rect x="2" y="5" width="18" height="1" fill="#FFFFFF"/>
  <rect x="2" y="5" width="1" height="13" fill="#FFFFFF"/>
  <rect x="2" y="17" width="18" height="1" fill="#999999"/>
  <rect x="19" y="5" width="1" height="13" fill="#999999"/>
  <rect x="4" y="7" width="10" height="9" fill="#000000"/>
  <rect x="5" y="8" width="8" height="7" fill="#FFFFFF"/>
  <rect x="16" y="6" width="3" height="9" fill="#000000"/>
  <rect x="17" y="7" width="1" height="7" fill="#FFFFFF"/>
  <rect x="16" y="16" width="3" height="2" fill="#000000"/>
</svg>
