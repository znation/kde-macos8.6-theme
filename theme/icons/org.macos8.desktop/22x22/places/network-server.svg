<!-- Platinum network server icon, 22x22.

     Our own 22x22 drawing in the Platinum palette: a raised chassis
     with a black outline, a white/#999999 bevel, two black drive-bay
     slots on the front and a grey indicator light below them. Drawn
     for this theme, not traced from anyone's artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22">
  <rect x="5" y="2" width="12" height="18" fill="#000000"/>
  <rect x="6" y="3" width="10" height="16" fill="#DDDDDD"/>
  <rect x="6" y="3" width="10" height="1" fill="#FFFFFF"/>
  <rect x="6" y="3" width="1" height="16" fill="#FFFFFF"/>
  <rect x="15" y="3" width="1" height="16" fill="#999999"/>
  <rect x="6" y="18" width="10" height="1" fill="#999999"/>
  <rect x="7" y="7" width="8" height="2" fill="#000000"/>
  <rect x="7" y="12" width="8" height="2" fill="#000000"/>
  <rect x="7" y="15" width="2" height="2" fill="#999999"/>
</svg>
