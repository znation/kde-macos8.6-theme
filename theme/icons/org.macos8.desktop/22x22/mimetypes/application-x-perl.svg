<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER: original Perl-script illustration pending user-approved artwork. -->
<!-- Platinum Perl-script icon, 22x22 rendition.

     Our own 22x22 drawing in the Platinum palette: the generic document's
     page holding a black capital letter P (a full-height left stem and a
     closed upper bowl) on the white face, clear of the folded corner.
     Drawn for this theme, not traced from anyone's artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22">
  <!-- Page outline with the top-right corner cut away. -->
  <path d="M4 1 h10 l4 4 v15 H4 Z" fill="#000000"/>
  <!-- White page, inset one pixel. -->
  <path d="M5 2 h8 l4 4 v13 H5 Z" fill="#FFFFFF"/>
  <!-- Folded corner flap. -->
  <path d="M13 2 L17 2 L17 6 Z" fill="#DDDDDD"/>
  <!-- Capital P: full-height left stem. -->
  <rect x="7" y="8" width="2" height="9" fill="#000000"/>
  <!-- Capital P: bowl top. -->
  <rect x="9" y="8" width="4" height="1" fill="#000000"/>
  <!-- Capital P: bowl right. -->
  <rect x="12" y="9" width="1" height="3" fill="#000000"/>
  <!-- Capital P: bowl bottom. -->
  <rect x="9" y="11" width="4" height="1" fill="#000000"/>
</svg>
