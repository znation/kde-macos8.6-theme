<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER: original office-presentation illustration pending user-approved artwork. -->
<!-- Platinum office-presentation icon, 22x22.

     Our own 22x22 drawing in the Platinum palette: the generic document's
     page (black outline, white page and folded corner) holding a slide
     with a black frame, a white field, a grey title band and three black
     bars of rising height. Drawn for this theme, not traced from anyone's
     artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22">
  <!-- Page outline with the top-right corner cut away. -->
  <path d="M4 1 h10 l4 4 v15 H4 Z" fill="#000000"/>
  <!-- White page, inset one pixel. -->
  <path d="M5 2 h8 l4 4 v13 H5 Z" fill="#FFFFFF"/>
  <!-- Folded corner flap. -->
  <path d="M13 2 L17 2 L17 6 Z" fill="#DDDDDD"/>
  <!-- Slide frame. -->
  <rect x="6" y="8" width="10" height="8" fill="#000000"/>
  <!-- Slide field. -->
  <rect x="7" y="9" width="8" height="6" fill="#FFFFFF"/>
  <!-- Title band. -->
  <rect x="7" y="9" width="8" height="1" fill="#DDDDDD"/>
  <!-- Bars of rising height. -->
  <rect x="8" y="13" width="1" height="1" fill="#000000"/>
  <rect x="10" y="12" width="1" height="2" fill="#000000"/>
  <rect x="12" y="11" width="1" height="3" fill="#000000"/>
</svg>
