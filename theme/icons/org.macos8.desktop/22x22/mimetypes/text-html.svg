<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER: original web-document illustration pending user-approved artwork. -->
<!-- Platinum web-document icon, 22x22.

     Our own 22x22 drawing in the Platinum palette: a small window with a
     #000000 outline, a #DDDDDD title bar with a #FFFFFF highlight and one
     #999999 stripe, a #FFFFFF body and a black globe (a ring with a black
     equator and meridian). Drawn for this theme, not traced from anyone's
     artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22">
  <!-- Window outline. -->
  <rect x="2" y="3" width="18" height="16" fill="#000000"/>
  <!-- Title bar face. -->
  <rect x="3" y="4" width="16" height="3" fill="#DDDDDD"/>
  <!-- Title bar highlight. -->
  <rect x="3" y="4" width="16" height="1" fill="#FFFFFF"/>
  <!-- Title bar stripe. -->
  <rect x="5" y="5" width="12" height="1" fill="#999999"/>
  <!-- White body. -->
  <rect x="3" y="8" width="16" height="10" fill="#FFFFFF"/>
  <!-- Globe ring, outer and inner. -->
  <circle cx="11" cy="13" r="4" fill="#000000"/>
  <circle cx="11" cy="13" r="3" fill="#FFFFFF"/>
  <!-- Globe equator. -->
  <rect x="8" y="13" width="7" height="1" fill="#000000"/>
  <!-- Globe meridian. -->
  <rect x="11" y="10" width="1" height="7" fill="#000000"/>
</svg>
