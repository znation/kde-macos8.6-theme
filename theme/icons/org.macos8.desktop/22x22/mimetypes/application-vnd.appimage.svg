<!-- PLACEHOLDER: original AppImage bundle illustration pending user-approved artwork. -->
<!-- Platinum AppImage bundle icon, 22x22.

     Our own 22x22 drawing in the Platinum palette: the document
     drawing (a #FFFFFF page with a 1px #000000 outline and a #DDDDDD
     folded top-right corner) with the text lines replaced by a launch
     arrow — an up-pointing #000000 triangle head over a #000000 shaft.
     Drawn for this theme, not traced from anyone's artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22">
  <!-- Page outline with the top-right corner cut away. -->
  <path d="M4 1 h10 l4 4 v15 H4 Z" fill="#000000"/>
  <!-- White page, inset one pixel. -->
  <path d="M5 2 h8 l4 4 v13 H5 Z" fill="#FFFFFF"/>
  <!-- Folded corner flap. -->
  <path d="M13 2 L17 2 L17 6 Z" fill="#DDDDDD"/>
  <!-- Launch arrow: an up-pointing head over a shaft. -->
  <path d="M11 5 L15 11 L7 11 Z" fill="#000000"/>
  <rect x="10" y="11" width="2" height="6" fill="#000000"/>
</svg>
