<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER: original Ogg audio illustration pending user-approved artwork. -->
<!-- Platinum Ogg audio icon, 22x22.

     Our own 22x22 drawing in the Platinum palette: the document
     drawing (a #FFFFFF page with a 1px #000000 outline and a #DDDDDD
     folded top-right corner) with the text lines replaced by an
     equalizer of four #000000 bars, bottom-aligned on one baseline.
     Drawn for this theme, not traced from anyone's artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22">
  <!-- Page outline with the top-right corner cut away. -->
  <path d="M4 1 h10 l4 4 v15 H4 Z" fill="#000000"/>
  <!-- White page, inset one pixel. -->
  <path d="M5 2 h8 l4 4 v13 H5 Z" fill="#FFFFFF"/>
  <!-- Folded corner flap. -->
  <path d="M13 2 L17 2 L17 6 Z" fill="#DDDDDD"/>
  <!-- Equalizer: four bars, shortest to tallest then the falling
       fourth, bottom-aligned on row 17. -->
  <rect x="7" y="13" width="1" height="4" fill="#000000"/>
  <rect x="9" y="11" width="1" height="6" fill="#000000"/>
  <rect x="11" y="9" width="1" height="8" fill="#000000"/>
  <rect x="13" y="12" width="1" height="5" fill="#000000"/>
</svg>
