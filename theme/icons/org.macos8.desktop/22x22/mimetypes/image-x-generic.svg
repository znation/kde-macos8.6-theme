<!-- Platinum image icon, 22x22.

     Our own 22x22 drawing in the Platinum palette: a framed photograph —
     a #000000 frame, a #DDDDDD matte, #FFFFFF photo paper, a #999999 sun,
     a #999999 mountain staircase and a #999999 ground band. Drawn for this
     theme, not traced from anyone's artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22">
  <!-- Frame. -->
  <rect x="2" y="2" width="18" height="18" fill="#000000"/>
  <!-- Matte. -->
  <rect x="3" y="3" width="16" height="16" fill="#DDDDDD"/>
  <!-- Photo paper. -->
  <rect x="4" y="4" width="14" height="14" fill="#FFFFFF"/>
  <!-- Sun. -->
  <rect x="15" y="6" width="2" height="2" fill="#999999"/>
  <!-- Mountain staircase. -->
  <rect x="4" y="12" width="3" height="2" fill="#999999"/>
  <rect x="7" y="10" width="3" height="4" fill="#999999"/>
  <rect x="10" y="9" width="3" height="5" fill="#999999"/>
  <rect x="13" y="11" width="3" height="3" fill="#999999"/>
  <!-- Ground band. -->
  <rect x="4" y="14" width="14" height="4" fill="#999999"/>
</svg>
