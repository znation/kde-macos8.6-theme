<!-- Platinum video icon, 22x22.

     Our own 22x22 drawing in the Platinum palette: a display screen with
     a play triangle — a #000000 frame, a #FFFFFF face, a #000000 play
     triangle centred on the face and a two-part #000000 stand (neck and
     base) under the frame. Drawn for this theme, not traced from
     anyone's artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22">
  <!-- Frame. -->
  <rect x="2" y="5" width="18" height="13" fill="#000000"/>
  <!-- Face. -->
  <rect x="3" y="6" width="16" height="11" fill="#FFFFFF"/>
  <!-- Play triangle. -->
  <path d="M9 8 L15 11 L9 14 Z" fill="#000000"/>
  <!-- Stand neck. -->
  <rect x="8" y="19" width="6" height="1" fill="#000000"/>
  <!-- Stand base. -->
  <rect x="5" y="20" width="12" height="1" fill="#000000"/>
</svg>
