<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER: original Ogg multimedia-container illustration pending user-approved artwork. -->
<!-- Platinum Ogg multimedia-container icon, 22x22.

     Our own 22x22 drawing in the Platinum palette: the generic document's
     page with a black film-strip band, two rows of white sprocket holes
     around a white frame window. Drawn for this theme, not traced from
     anyone's artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22">
  <!-- Page outline with the top-right corner cut away. -->
  <path d="M4 1 h10 l4 4 v15 H4 Z" fill="#000000"/>
  <!-- White page, inset one pixel. -->
  <path d="M5 2 h8 l4 4 v13 H5 Z" fill="#FFFFFF"/>
  <!-- Folded corner flap. -->
  <path d="M13 2 L17 2 L17 6 Z" fill="#DDDDDD"/>
  <!-- Film-strip band. -->
  <rect x="6" y="10" width="10" height="8" fill="#000000"/>
  <!-- Upper sprocket holes. -->
  <rect x="7" y="11" width="2" height="1" fill="#FFFFFF"/>
  <rect x="10" y="11" width="2" height="1" fill="#FFFFFF"/>
  <rect x="13" y="11" width="2" height="1" fill="#FFFFFF"/>
  <!-- Frame window. -->
  <rect x="8" y="13" width="6" height="2" fill="#FFFFFF"/>
  <!-- Lower sprocket holes. -->
  <rect x="7" y="16" width="2" height="1" fill="#FFFFFF"/>
  <rect x="10" y="16" width="2" height="1" fill="#FFFFFF"/>
  <rect x="13" y="16" width="2" height="1" fill="#FFFFFF"/>
</svg>
