<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER: original 7z-archive illustration pending user-approved artwork. -->
<!-- Platinum 7z-archive icon, 22x22 rendition.

     Our own 22x22 redraw in the Platinum palette: the sealed package
     box (a black outline, a #DDDDDD lid band with a white top row, a
     white body and a grey tape stripe) holding a stepped numeral 7 on
     the white face, left of the tape. Drawn for this theme, not traced
     from anyone's artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22">
  <!-- Sealed package box, shared with package-x-generic. -->
  <rect x="2" y="4" width="18" height="16" fill="#000000"/>
  <rect x="3" y="5" width="16" height="2" fill="#DDDDDD"/>
  <rect x="3" y="5" width="16" height="1" fill="#FFFFFF"/>
  <rect x="3" y="7" width="16" height="12" fill="#FFFFFF"/>
  <rect x="10" y="7" width="2" height="12" fill="#999999"/>
  <!-- Stepped numeral 7. -->
  <rect x="5" y="8" width="4" height="2" fill="#000000"/>
  <rect x="7" y="10" width="2" height="2" fill="#000000"/>
  <rect x="6" y="12" width="2" height="2" fill="#000000"/>
</svg>
