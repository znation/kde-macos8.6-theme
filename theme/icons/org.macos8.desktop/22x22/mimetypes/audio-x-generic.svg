<!-- PLACEHOLDER: original audio illustration pending user-approved artwork. -->
<!-- Platinum audio icon, 22x22.

     Our own 22x22 drawing in the Platinum palette: a beamed pair of
     eighth notes with two #000000 note heads, two #000000 stems and one
     #000000 beam. Drawn for this theme, not traced from anyone's
     artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22">
  <!-- Left note head. -->
  <rect x="4" y="16" width="5" height="3" fill="#000000"/>
  <!-- Left stem. -->
  <rect x="8" y="4" width="2" height="15" fill="#000000"/>
  <!-- Right note head. -->
  <rect x="12" y="14" width="5" height="3" fill="#000000"/>
  <!-- Right stem. -->
  <rect x="15" y="4" width="2" height="13" fill="#000000"/>
  <!-- Beam. -->
  <rect x="8" y="4" width="9" height="3" fill="#000000"/>
</svg>
