<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER: original BitTorrent-file illustration pending user-approved artwork. -->
<!-- Platinum BitTorrent-file icon, 22x22 rendition.

     Our own 22x22 drawing in the Platinum palette: the generic document's
     page with its text lines replaced by a black band holding a white
     download arrow over a tray. Drawn for this theme, not traced from
     anyone's artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22">
  <!-- Page outline with the top-right corner cut away. -->
  <path d="M4 1 h10 l4 4 v15 H4 Z" fill="#000000"/>
  <!-- White page, inset one pixel. -->
  <path d="M5 2 h8 l4 4 v13 H5 Z" fill="#FFFFFF"/>
  <!-- Folded corner flap. -->
  <path d="M13 2 L17 2 L17 6 Z" fill="#DDDDDD"/>
  <!-- Download band. -->
  <rect x="7" y="10" width="8" height="5" fill="#000000"/>
  <!-- Download arrow, whole-pixel cells. -->
  <rect x="10" y="11" width="1" height="1" fill="#FFFFFF"/>
  <rect x="9" y="12" width="3" height="1" fill="#FFFFFF"/>
  <rect x="10" y="13" width="1" height="1" fill="#FFFFFF"/>
  <!-- Tray. -->
  <rect x="9" y="14" width="4" height="1" fill="#FFFFFF"/>
</svg>
