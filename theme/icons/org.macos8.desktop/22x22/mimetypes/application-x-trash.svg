<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER: original backup-file illustration pending user-approved artwork. -->
<!-- Platinum backup-file icon, 22x22 rendition.

     Our own 22x22 redraw in the Platinum palette: a small window with a
     #000000 outline, a #DDDDDD title bar with a #FFFFFF highlight and one
     #999999 stripe, a #FFFFFF body and a black tilde, the classic
     editor-backup mark. Drawn for this theme, not traced from anyone's
     artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22">
  <!-- Window outline. -->
  <rect x="2" y="3" width="18" height="16" fill="#000000"/>
  <!-- Title bar face. -->
  <rect x="3" y="4" width="16" height="3" fill="#DDDDDD"/>
  <!-- Title bar highlight. -->
  <rect x="3" y="4" width="16" height="1" fill="#FFFFFF"/>
  <!-- Title bar stripe. -->
  <rect x="5" y="5" width="12" height="1" fill="#999999"/>
  <!-- White body. -->
  <rect x="3" y="8" width="16" height="10" fill="#FFFFFF"/>
  <!-- Tilde (editor-backup mark), whole-pixel columns. -->
  <rect x="4" y="11" width="4" height="1" fill="#000000"/>
  <rect x="8" y="12" width="6" height="1" fill="#000000"/>
  <rect x="14" y="11" width="4" height="1" fill="#000000"/>
</svg>
