  <circle cx="11" cy="11" r="10" fill="#000000"/>
  <circle cx="11" cy="11" r="9" fill="#DDDDDD"/>
  <rect x="5" y="7" width="12" height="2" fill="#FFFFFF"/>
  <rect x="6" y="10" width="10" height="2" fill="#FFFFFF"/>
  <rect x="7" y="13" width="8" height="2" fill="#FFFFFF"/>
</svg>
