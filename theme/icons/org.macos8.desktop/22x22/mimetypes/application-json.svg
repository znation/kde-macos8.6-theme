<!-- PLACEHOLDER: original JSON illustration pending user-approved artwork. -->
<!-- Platinum JSON-document icon, 22x22 rendition.

     Our own 22x22 drawing in the Platinum palette: the generic document's
     page with two black curly braces and no code lines. Drawn for this
     theme, not traced from anyone's artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22">
  <!-- Page outline with the top-right corner cut away. -->
  <path d="M4 1 h10 l4 4 v15 H4 Z" fill="#000000"/>
  <!-- White page, inset one pixel. -->
  <path d="M5 2 h8 l4 4 v13 H5 Z" fill="#FFFFFF"/>
  <!-- Folded corner flap. -->
  <path d="M13 2 L17 2 L17 6 Z" fill="#DDDDDD"/>
  <!-- Left curly brace. -->
  <rect x="9" y="8" width="1" height="1" fill="#000000"/>
  <rect x="8" y="9" width="1" height="1" fill="#000000"/>
  <rect x="7" y="10" width="1" height="1" fill="#000000"/>
  <rect x="7" y="11" width="1" height="1" fill="#000000"/>
  <rect x="7" y="12" width="1" height="1" fill="#000000"/>
  <rect x="8" y="13" width="1" height="1" fill="#000000"/>
  <rect x="9" y="14" width="1" height="1" fill="#000000"/>
  <!-- Right curly brace. -->
  <rect x="12" y="8" width="1" height="1" fill="#000000"/>
  <rect x="13" y="9" width="1" height="1" fill="#000000"/>
  <rect x="14" y="10" width="1" height="1" fill="#000000"/>
  <rect x="14" y="11" width="1" height="1" fill="#000000"/>
  <rect x="14" y="12" width="1" height="1" fill="#000000"/>
  <rect x="13" y="13" width="1" height="1" fill="#000000"/>
  <rect x="12" y="14" width="1" height="1" fill="#000000"/>
</svg>
