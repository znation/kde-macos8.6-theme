<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER: original desktop-launcher illustration pending user-approved artwork. -->
<!-- Platinum desktop-launcher icon, 22x22.

     Our own 22x22 drawing in the Platinum palette: the document drawing
     (a #FFFFFF page with a 1px #000000 outline and a #DDDDDD folded
     top-right corner) with the text lines replaced by a small window (a
     black outline holding a white face under a black title-bar band).
     Drawn for this theme, not traced from anyone's artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22">
  <!-- Page outline with the top-right corner cut away. -->
  <path d="M4 1 h10 l4 4 v15 H4 Z" fill="#000000"/>
  <!-- White page, inset one pixel. -->
  <path d="M5 2 h8 l4 4 v13 H5 Z" fill="#FFFFFF"/>
  <!-- Folded corner flap. -->
  <path d="M13 2 L17 2 L17 6 Z" fill="#DDDDDD"/>
  <!-- Window outline. -->
  <rect x="7" y="9" width="8" height="7" fill="#000000"/>
  <!-- Window face, inset one pixel. -->
  <rect x="8" y="10" width="6" height="5" fill="#FFFFFF"/>
  <!-- Title-bar band across the face's top. -->
  <rect x="8" y="10" width="6" height="2" fill="#000000"/>
</svg>
