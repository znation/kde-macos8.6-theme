<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER: original PGP-key illustration pending user-approved artwork. -->
<!-- Platinum PGP-key icon, 22x22 rendition.

     Our own 22x22 redraw in the Platinum palette: a small window with a
     #000000 outline, a #DDDDDD title bar with a #FFFFFF highlight and one
     #999999 stripe, a #FFFFFF body and a black skeleton key.
     Drawn for this theme, not traced from anyone's artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22">
  <!-- Window outline. -->
  <rect x="2" y="3" width="18" height="16" fill="#000000"/>
  <!-- Title bar face. -->
  <rect x="3" y="4" width="16" height="3" fill="#DDDDDD"/>
  <!-- Title bar highlight. -->
  <rect x="3" y="4" width="16" height="1" fill="#FFFFFF"/>
  <!-- Title bar stripe. -->
  <rect x="5" y="5" width="12" height="1" fill="#999999"/>
  <!-- White body. -->
  <rect x="3" y="8" width="16" height="10" fill="#FFFFFF"/>
  <!-- Key bow ring. -->
  <rect x="4" y="9" width="5" height="1" fill="#000000"/>
  <rect x="4" y="13" width="5" height="1" fill="#000000"/>
  <rect x="4" y="10" width="1" height="3" fill="#000000"/>
  <rect x="8" y="10" width="1" height="3" fill="#000000"/>
  <!-- Key stem. -->
  <rect x="9" y="11" width="6" height="1" fill="#000000"/>
  <!-- Key teeth. -->
  <rect x="11" y="12" width="1" height="2" fill="#000000"/>
  <rect x="14" y="12" width="1" height="2" fill="#000000"/>
</svg>
