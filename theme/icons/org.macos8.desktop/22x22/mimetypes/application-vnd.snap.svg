<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER: original Snap package illustration pending user-approved artwork. -->
<!-- Platinum Snap-package icon, 22x22 rendition.

     Our own 22x22 drawing in the Platinum palette: the generic document's
     page with a strapped crate — a closed box with a black lid seam and
     one vertical black strap down the middle, the sealed-package mark
     that keeps the Snap type distinct from its Squashfs filesystem-image
     superclass. Drawn for this theme, not traced from anyone's artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22">
  <!-- Page outline with the top-right corner cut away. -->
  <path d="M4 1 h10 l4 4 v15 H4 Z" fill="#000000"/>
  <!-- White page, inset one pixel. -->
  <path d="M5 2 h8 l4 4 v13 H5 Z" fill="#FFFFFF"/>
  <!-- Folded corner flap. -->
  <path d="M13 2 L17 2 L17 6 Z" fill="#DDDDDD"/>
  <!-- Crate frame. -->
  <rect x="7" y="8" width="8" height="8" fill="#000000"/>
  <!-- Crate face. -->
  <rect x="8" y="9" width="6" height="6" fill="#DDDDDD"/>
  <!-- Lid seam. -->
  <rect x="7" y="11" width="8" height="1" fill="#000000"/>
  <!-- Vertical strap. -->
  <rect x="10" y="8" width="2" height="8" fill="#000000"/>
</svg>
