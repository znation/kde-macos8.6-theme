<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER: original PDF-document illustration pending user-approved artwork. -->
<!-- Platinum PDF document icon, 22x22.

     Our own 22x22 drawing in the Platinum palette: the generic
     document's page (a #FFFFFF page with a 1px #000000 outline and a
     #DDDDDD folded top-right corner) under a grey text line and a black
     seal plate with a #DDDDDD face. Drawn for this theme, not traced
     from anyone's artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22">
  <!-- Page outline with the top-right corner cut away. -->
  <path d="M4 1 h10 l4 4 v15 H4 Z" fill="#000000"/>
  <!-- White page, inset one pixel. -->
  <path d="M5 2 h8 l4 4 v13 H5 Z" fill="#FFFFFF"/>
  <!-- Folded corner flap. -->
  <path d="M13 2 L17 2 L17 6 Z" fill="#DDDDDD"/>
  <!-- Text line. -->
  <rect x="7" y="8" width="8" height="1" fill="#999999"/>
  <!-- Seal plate. -->
  <rect x="11" y="11" width="5" height="5" fill="#000000"/>
  <!-- Seal face. -->
  <rect x="12" y="12" width="3" height="3" fill="#DDDDDD"/>
</svg>
