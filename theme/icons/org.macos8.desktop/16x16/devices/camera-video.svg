<!-- Platinum film-camera icon, 16x16.

     Our own 16x16 drawing in the Platinum palette: two film reels on
     top, a raised body with a black outline and white/#999999 bevel,
     a black lens hood on the body's right edge, and two tripod legs
     below the body. Drawn for this theme, not traced from anyone's
     artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <circle cx="5" cy="4" r="2" fill="#000000"/>
  <circle cx="5" cy="4" r="1" fill="#DDDDDD"/>
  <circle cx="10" cy="4" r="2" fill="#000000"/>
  <circle cx="10" cy="4" r="1" fill="#DDDDDD"/>
  <rect x="2" y="6" width="10" height="7" fill="#000000"/>
  <rect x="3" y="7" width="8" height="5" fill="#DDDDDD"/>
  <rect x="3" y="7" width="8" height="1" fill="#FFFFFF"/>
  <rect x="3" y="7" width="1" height="5" fill="#FFFFFF"/>
  <rect x="3" y="11" width="8" height="1" fill="#999999"/>
  <rect x="10" y="7" width="1" height="5" fill="#999999"/>
  <rect x="12" y="8" width="2" height="3" fill="#000000"/>
  <rect x="4" y="13" width="2" height="2" fill="#000000"/>
  <rect x="8" y="13" width="2" height="2" fill="#000000"/>
</svg>
