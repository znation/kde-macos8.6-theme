<!-- PLACEHOLDER: original tablet illustration pending user-approved artwork. -->
<!-- Platinum tablet icon, 16x16.

     Our own 16x16 drawing in the Platinum palette: a graphics tablet
     seen from above, with a black outline, a #DDDDDD body with a
     white top row and left column and a #999999 bottom row and right
     column, a white drawing surface outlined in black on the left,
     and an upright pen on the right with a white barrel stripe (the
     16x16 cell drops the pen's tip notch).
     Drawn for this theme, not traced from anyone's artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <rect x="1" y="2" width="14" height="11" fill="#000000"/>
  <rect x="2" y="3" width="12" height="9" fill="#DDDDDD"/>
  <rect x="2" y="3" width="12" height="1" fill="#FFFFFF"/>
  <rect x="2" y="3" width="1" height="9" fill="#FFFFFF"/>
  <rect x="2" y="11" width="12" height="1" fill="#999999"/>
  <rect x="13" y="3" width="1" height="9" fill="#999999"/>
  <rect x="3" y="5" width="6" height="6" fill="#000000"/>
  <rect x="4" y="6" width="4" height="4" fill="#FFFFFF"/>
  <rect x="11" y="4" width="2" height="9" fill="#000000"/>
  <rect x="11" y="5" width="1" height="7" fill="#FFFFFF"/>
</svg>
