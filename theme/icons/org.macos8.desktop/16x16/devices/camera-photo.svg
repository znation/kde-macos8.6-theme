<!-- Platinum camera icon, 16x16.

     Our own 16x16 drawing in the Platinum palette: a raised body with
     a black outline and white/#999999 bevel, a prism bump on top, a
     flash window and shutter button on the body's top row, and a
     centred lens barrel with glass, iris and pupil. Drawn for this
     theme, not traced from anyone's artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <rect x="3" y="3" width="3" height="1" fill="#000000"/>
  <rect x="1" y="4" width="14" height="11" fill="#000000"/>
  <rect x="2" y="5" width="12" height="9" fill="#DDDDDD"/>
  <rect x="2" y="5" width="12" height="1" fill="#FFFFFF"/>
  <rect x="2" y="5" width="1" height="9" fill="#FFFFFF"/>
  <rect x="2" y="13" width="12" height="1" fill="#999999"/>
  <rect x="13" y="5" width="1" height="9" fill="#999999"/>
  <rect x="3" y="6" width="2" height="1" fill="#000000"/>
  <rect x="11" y="6" width="2" height="1" fill="#000000"/>
  <circle cx="8" cy="9" r="3" fill="#000000"/>
  <circle cx="8" cy="9" r="2" fill="#FFFFFF"/>
  <circle cx="8" cy="9" r="1" fill="#999999"/>
</svg>
