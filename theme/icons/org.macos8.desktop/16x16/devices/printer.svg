<!-- Platinum printer icon, 16x16.

     Our own 16x16 drawing in the Platinum palette: a sheet feeding
     from the top, the raised body with a black outline, a white and
     #999999 bevel, a black output slot, a sheet emerging from the slot
     down the front, and a black power light. Drawn for this theme,
     not traced from anyone's artwork. -->
