<!-- PLACEHOLDER: original floppy-disk illustration pending user-approved artwork. -->
<!-- Platinum floppy-disk icon, 16x16.

     Our own 16x16 drawing in the Platinum palette: a square disk seen
     from the front, with a black outline, a #DDDDDD body with a white
     top row and left column and a #999999 bottom row and right column,
     a metal shutter window with a slot at the top, and a white label
     plate outlined in black at the bottom.
     Drawn for this theme, not traced from anyone's artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <rect x="1" y="1" width="14" height="14" fill="#000000"/>
  <rect x="2" y="2" width="12" height="12" fill="#DDDDDD"/>
  <rect x="2" y="2" width="12" height="1" fill="#FFFFFF"/>
  <rect x="2" y="2" width="1" height="12" fill="#FFFFFF"/>
  <rect x="2" y="13" width="12" height="1" fill="#999999"/>
  <rect x="13" y="2" width="1" height="12" fill="#999999"/>
  <rect x="6" y="3" width="5" height="4" fill="#000000"/>
  <rect x="7" y="4" width="3" height="2" fill="#DDDDDD"/>
  <rect x="8" y="4" width="1" height="2" fill="#000000"/>
  <rect x="4" y="8" width="8" height="5" fill="#000000"/>
  <rect x="5" y="9" width="6" height="3" fill="#FFFFFF"/>
</svg>
