<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER: original mouse illustration pending user-approved artwork. -->
<!-- Mac OS 8.6 "Platinum" input-mouse icon.

     Our own 16x16 drawing in the Platinum palette: a black-outlined rounded
     mouse body with a #DDDDDD face, a white two-button band across the top, a
     black split between the buttons and a black scroll wheel below the band.
     Drawn for this theme, not traced from anyone's artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Body outline. -->
  <rect x="3" y="2" width="10" height="12" rx="5" fill="#000000"/>
  <!-- Body face. -->
  <rect x="4" y="3" width="8" height="10" rx="4" fill="#DDDDDD"/>
  <!-- Two-button band. -->
  <rect x="4" y="3" width="8" height="3" fill="#FFFFFF"/>
  <!-- Split between the buttons. -->
  <rect x="7" y="3" width="2" height="3" fill="#000000"/>
  <!-- Scroll wheel. -->
  <rect x="7" y="7" width="2" height="3" rx="1" fill="#000000"/>
</svg>
