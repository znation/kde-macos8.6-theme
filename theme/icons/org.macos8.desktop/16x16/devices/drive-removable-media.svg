<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER: original removable-drive illustration pending user-approved artwork. -->
<!-- Platinum removable-media drive icon.

     Our own 16x16 drawing in the Platinum palette, not traced from anyone's
     artwork: the hard disk's body and bevel, with a media slot (black, with a
     white lower lip) and a black eject button in place of the label plate and
     light. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Body outline and #DDDDDD face. -->
  <rect x="1" y="3" width="14" height="10" fill="#000000"/>
  <rect x="2" y="4" width="12" height="8" fill="#DDDDDD"/>
  <!-- Platinum bevel: white along the top and left, grey along the bottom
       and right. -->
  <rect x="2" y="4" width="12" height="1" fill="#FFFFFF"/>
  <rect x="2" y="4" width="1" height="8" fill="#FFFFFF"/>
  <rect x="2" y="11" width="12" height="1" fill="#999999"/>
  <rect x="13" y="4" width="1" height="8" fill="#999999"/>
  <!-- Media slot with its white lower lip. -->
  <rect x="4" y="7" width="8" height="1" fill="#000000"/>
  <rect x="4" y="8" width="8" height="1" fill="#FFFFFF"/>
  <!-- Eject button. -->
  <rect x="9" y="10" width="3" height="1" fill="#000000"/>
</svg>
