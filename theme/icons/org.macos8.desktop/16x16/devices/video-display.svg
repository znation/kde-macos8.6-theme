<!-- Platinum video-display icon, 16x16.

     Our own 16x16 drawing in the Platinum palette: a monitor with a
     black outlined housing, a white and #999999 bevel around a #DDDDDD
     face, a black screen with a white glint and a black two-part
     stand under the housing. Drawn for this theme, not traced from
     anyone's artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <rect x="1" y="2" width="14" height="12" fill="#000000"/>
  <rect x="2" y="3" width="12" height="10" fill="#DDDDDD"/>
  <rect x="2" y="3" width="12" height="1" fill="#FFFFFF"/>
  <rect x="2" y="3" width="1" height="10" fill="#FFFFFF"/>
  <rect x="2" y="12" width="12" height="1" fill="#999999"/>
  <rect x="13" y="3" width="1" height="10" fill="#999999"/>
  <rect x="4" y="5" width="8" height="6" fill="#000000"/>
  <rect x="5" y="6" width="3" height="2" fill="#FFFFFF"/>
  <rect x="6" y="14" width="4" height="1" fill="#000000"/>
  <rect x="4" y="15" width="8" height="1" fill="#000000"/>
</svg>
