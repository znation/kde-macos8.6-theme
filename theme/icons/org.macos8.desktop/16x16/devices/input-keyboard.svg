<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER: original keyboard illustration pending user-approved artwork. -->
<!-- Platinum keyboard icon, 16x16.

     Our own 16x16 drawing in the Platinum palette: a raised #DDDDDD face
     with a 1px #000000 body outline and the Platinum bevel (#FFFFFF top
     and left, #999999 bottom and right), two rows of black keys and a
     black space bar. Drawn for this theme, not traced from anyone's
     artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Body outline and #DDDDDD face. -->
  <rect x="1" y="5" width="14" height="8" fill="#000000"/>
  <rect x="2" y="6" width="12" height="6" fill="#DDDDDD"/>
  <!-- Platinum bevel: white along the top and left, grey along the bottom
       and right. -->
  <rect x="2" y="6" width="12" height="1" fill="#FFFFFF"/>
  <rect x="2" y="6" width="1" height="6" fill="#FFFFFF"/>
  <rect x="2" y="11" width="12" height="1" fill="#999999"/>
  <rect x="13" y="6" width="1" height="6" fill="#999999"/>
  <!-- Key rows. -->
  <rect x="3" y="7" width="2" height="1" fill="#000000"/>
  <rect x="6" y="7" width="2" height="1" fill="#000000"/>
  <rect x="9" y="7" width="4" height="1" fill="#000000"/>
  <rect x="3" y="9" width="2" height="1" fill="#000000"/>
  <rect x="6" y="9" width="2" height="1" fill="#000000"/>
  <rect x="9" y="9" width="4" height="1" fill="#000000"/>
  <!-- Space bar row. -->
  <rect x="4" y="10" width="6" height="1" fill="#000000"/>
</svg>
