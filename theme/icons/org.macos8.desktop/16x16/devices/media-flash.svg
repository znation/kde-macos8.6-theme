<!-- Platinum flash-media icon, 16x16.

     Our own 16x16 drawing in the Platinum palette: an upright flash
     card standing on its contact pins, with a black outline, a
     #DDDDDD body with a white top row and left column and a #999999
     bottom row and right column, a white label plate outlined in
     black, and a row of two black contact pins clear of the bevel.
     Drawn for this theme, not traced from anyone's artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <rect x="4" y="1" width="8" height="14" fill="#000000"/>
  <rect x="5" y="2" width="6" height="12" fill="#DDDDDD"/>
  <rect x="5" y="2" width="6" height="1" fill="#FFFFFF"/>
  <rect x="5" y="2" width="1" height="12" fill="#FFFFFF"/>
  <rect x="5" y="13" width="6" height="1" fill="#999999"/>
  <rect x="10" y="2" width="1" height="12" fill="#999999"/>
  <rect x="6" y="4" width="4" height="3" fill="#000000"/>
  <rect x="7" y="5" width="2" height="1" fill="#FFFFFF"/>
  <rect x="6" y="10" width="1" height="2" fill="#000000"/>
  <rect x="8" y="10" width="1" height="2" fill="#000000"/>
</svg>
