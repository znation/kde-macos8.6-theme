<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER: original smartphone illustration pending user-approved artwork. -->
<!-- Platinum smartphone icon, 16x16.

     Our own 16x16 drawing in the Platinum palette, shared with the
     phone icon: an upright smartphone
     with a raised #DDDDDD body, a 1px #000000 outline and the Platinum
     bevel (#FFFFFF top and left, #999999 bottom and right), a black
     screen, a black speaker slot above the screen and a black home
     button below it. Drawn for this theme, not traced from anyone's
     artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Body outline and #DDDDDD face. -->
  <rect x="3" y="1" width="10" height="14" fill="#000000"/>
  <rect x="4" y="2" width="8" height="12" fill="#DDDDDD"/>
  <!-- Platinum bevel: white along the top and left, grey along the bottom
       and right. -->
  <rect x="4" y="2" width="8" height="1" fill="#FFFFFF"/>
  <rect x="4" y="2" width="1" height="12" fill="#FFFFFF"/>
  <rect x="4" y="13" width="8" height="1" fill="#999999"/>
  <rect x="11" y="2" width="1" height="12" fill="#999999"/>
  <!-- Screen. -->
  <rect x="5" y="4" width="6" height="7" fill="#000000"/>
  <!-- Speaker slot. -->
  <rect x="7" y="3" width="2" height="1" fill="#000000"/>
  <!-- Home button. -->
  <rect x="7" y="12" width="2" height="1" fill="#000000"/>
</svg>
