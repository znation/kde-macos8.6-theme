<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER: original audio illustration pending user-approved artwork. -->
<!-- Platinum audio icon, 16x16.

     Our own 16x16 drawing in the Platinum palette: a beamed pair of
     eighth notes with two #000000 note heads, two #000000 stems and one
     #000000 beam. Drawn for this theme, not traced from anyone's
     artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Left note head. -->
  <rect x="2" y="11" width="4" height="2" fill="#000000"/>
  <!-- Left stem. -->
  <rect x="5" y="3" width="1" height="10" fill="#000000"/>
  <!-- Right note head. -->
  <rect x="9" y="10" width="4" height="2" fill="#000000"/>
  <!-- Right stem. -->
  <rect x="12" y="3" width="1" height="9" fill="#000000"/>
  <!-- Beam. -->
  <rect x="5" y="3" width="8" height="2" fill="#000000"/>
</svg>
