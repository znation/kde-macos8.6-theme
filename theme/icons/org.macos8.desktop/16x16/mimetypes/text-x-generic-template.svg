<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER: original template illustration pending user-approved artwork. -->
<!-- Mac OS 8.6 "Platinum" template document icon, 16x16 rendition.

     Our own 16x16 redraw in the Platinum palette: the generic document's
     page holding a stencil plate — a #000000 frame around a #DDDDDD field
     with a #FFFFFF cut notch centred on each of the frame's four edges.
     Drawn for this theme, not traced from Apple's artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Page outline with the top-right corner cut away. -->
  <path d="M3 1 h7 l3 3 v10 H3 Z" fill="#000000"/>
  <!-- White page, inset one pixel. -->
  <path d="M4 2 h5 l3 3 v8 H4 Z" fill="#FFFFFF"/>
  <!-- Folded corner flap. -->
  <path d="M9 2 L12 2 L12 5 Z" fill="#DDDDDD"/>
  <!-- Stencil plate: black frame. -->
  <rect x="5" y="6" width="7" height="5" fill="#000000"/>
  <!-- Stencil plate: grey field. -->
  <rect x="6" y="7" width="5" height="3" fill="#DDDDDD"/>
  <!-- Cut notches, one centred on each frame edge. -->
  <rect x="7" y="6" width="2" height="1" fill="#FFFFFF"/>
  <rect x="7" y="10" width="2" height="1" fill="#FFFFFF"/>
  <rect x="5" y="7" width="1" height="2" fill="#FFFFFF"/>
  <rect x="11" y="7" width="1" height="2" fill="#FFFFFF"/>
</svg>
