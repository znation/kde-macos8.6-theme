<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER: original Perl-script illustration pending user-approved artwork. -->
<!-- Platinum Perl-script icon, 16x16 rendition.

     Our own 16x16 drawing in the Platinum palette: the generic document's
     page holding a black capital letter P (a full-height left stem and a
     closed upper bowl) on the white face, clear of the folded corner.
     Drawn for this theme, not traced from anyone's artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Page outline with the top-right corner cut away. -->
  <path d="M3 1 h7 l3 3 v10 H3 Z" fill="#000000"/>
  <!-- White page, inset one pixel. -->
  <path d="M4 2 h5 l3 3 v8 H4 Z" fill="#FFFFFF"/>
  <!-- Folded corner flap. -->
  <path d="M9 2 L12 2 L12 5 Z" fill="#DDDDDD"/>
  <!-- Capital P: full-height left stem. -->
  <rect x="5" y="6" width="1" height="6" fill="#000000"/>
  <!-- Capital P: bowl top. -->
  <rect x="6" y="6" width="3" height="1" fill="#000000"/>
  <!-- Capital P: bowl right. -->
  <rect x="8" y="7" width="1" height="2" fill="#000000"/>
  <!-- Capital P: bowl bottom. -->
  <rect x="6" y="8" width="3" height="1" fill="#000000"/>
</svg>
