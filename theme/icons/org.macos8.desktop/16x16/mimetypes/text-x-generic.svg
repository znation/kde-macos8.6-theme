<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER: original document illustration pending user-approved artwork. -->
<!-- Mac OS 8.6 "Platinum" generic document icon, 16x16 rendition.

     Our own 16x16 redraw in the Platinum palette: a #FFFFFF page with a 1px
     #000000 outline, a #DDDDDD folded top-right corner and #999999 text
     lines. Drawn for this theme, not traced from Apple's artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Page outline with the top-right corner cut away. -->
  <path d="M3 1 h7 l3 3 v10 H3 Z" fill="#000000"/>
  <!-- White page, inset one pixel. -->
  <path d="M4 2 h5 l3 3 v8 H4 Z" fill="#FFFFFF"/>
  <!-- Folded corner flap. -->
  <path d="M9 2 L12 2 L12 5 Z" fill="#DDDDDD"/>
  <!-- Text lines. -->
  <rect x="5" y="7" width="6" height="1" fill="#999999"/>
  <rect x="5" y="9" width="6" height="1" fill="#999999"/>
  <rect x="5" y="11" width="4" height="1" fill="#999999"/>
</svg>
