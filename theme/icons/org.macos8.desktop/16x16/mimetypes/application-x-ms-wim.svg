<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER: original WIM disk-image illustration pending user-approved artwork. -->
<!-- Platinum WIM disk-image icon, 16x16 rendition.

     Our own 16x16 redraw in the Platinum palette: a small window with a
     #000000 outline, a #DDDDDD title bar with a #FFFFFF highlight and one
     #999999 stripe and a #FFFFFF body, holding a black split image plate
     with notched corners cut by a white vertical gap, the split-volume
     mark. Drawn for this theme, not traced from anyone's artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Window outline. -->
  <rect x="1" y="2" width="14" height="12" fill="#000000"/>
  <!-- Title bar face. -->
  <rect x="2" y="3" width="12" height="3" fill="#DDDDDD"/>
  <!-- Title bar highlight. -->
  <rect x="2" y="3" width="12" height="1" fill="#FFFFFF"/>
  <!-- Title bar stripe. -->
  <rect x="4" y="4" width="8" height="1" fill="#999999"/>
  <!-- White body. -->
  <rect x="2" y="7" width="12" height="6" fill="#FFFFFF"/>
  <!-- Split image plate. -->
  <rect x="3" y="8" width="10" height="4" fill="#000000"/>
  <!-- Plate corner notches. -->
  <rect x="3" y="8" width="1" height="1" fill="#FFFFFF"/>
  <rect x="12" y="8" width="1" height="1" fill="#FFFFFF"/>
  <rect x="3" y="11" width="1" height="1" fill="#FFFFFF"/>
  <rect x="12" y="11" width="1" height="1" fill="#FFFFFF"/>
  <!-- Split-volume gap. -->
  <rect x="8" y="8" width="1" height="4" fill="#FFFFFF"/>
</svg>
