<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER: original core-dump illustration pending user-approved artwork. -->
<!-- Platinum core-dump icon, 16x16 rendition.

     Our own 16x16 redraw in the Platinum palette: the document drawing
     (a #FFFFFF page with a 1px #000000 outline and a #DDDDDD folded
     top-right corner) with the text lines replaced by a black band
     holding a white square ring, too small at this size to center a
     dot. Drawn for this theme, not traced from anyone's artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Page outline with the top-right corner cut away. -->
  <path d="M3 1 h7 l3 3 v10 H3 Z" fill="#000000"/>
  <!-- White page, inset one pixel. -->
  <path d="M4 2 h5 l3 3 v8 H4 Z" fill="#FFFFFF"/>
  <!-- Folded corner flap. -->
  <path d="M9 2 L12 2 L12 5 Z" fill="#DDDDDD"/>
  <!-- Crash-core band. -->
  <rect x="5" y="6" width="6" height="5" fill="#000000"/>
  <!-- Square ring, whole-pixel cells. -->
  <rect x="6" y="7" width="4" height="1" fill="#FFFFFF"/>
  <rect x="6" y="8" width="1" height="1" fill="#FFFFFF"/>
  <rect x="9" y="8" width="1" height="1" fill="#FFFFFF"/>
  <rect x="6" y="9" width="4" height="1" fill="#FFFFFF"/>
</svg>
