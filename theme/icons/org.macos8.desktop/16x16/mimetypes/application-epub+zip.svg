<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER: original electronic book illustration pending user-approved artwork. -->
<!-- Platinum electronic-book icon, 16x16.

     Our own 16x16 drawing in the Platinum palette: the generic document's
     page (black outline, white page and folded corner) holding a black
     lowercase e — an open reader's letter on the blank page. Drawn for
     this theme, not traced from anyone's artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Page outline with the top-right corner cut away. -->
  <path d="M3 1 h7 l3 3 v10 H3 Z" fill="#000000"/>
  <!-- White page, inset one pixel. -->
  <path d="M4 2 h5 l3 3 v8 H4 Z" fill="#FFFFFF"/>
  <!-- Folded corner flap. -->
  <path d="M9 2 L12 2 L12 5 Z" fill="#DDDDDD"/>
  <!-- Lowercase e: top bar. -->
  <rect x="5" y="7" width="5" height="1" fill="#000000"/>
  <!-- Upper-right notch. -->
  <rect x="8" y="8" width="2" height="1" fill="#000000"/>
  <!-- Middle bar. -->
  <rect x="5" y="9" width="5" height="1" fill="#000000"/>
  <!-- Lower-left notch. -->
  <rect x="5" y="10" width="2" height="1" fill="#000000"/>
  <!-- Bottom bar. -->
  <rect x="5" y="11" width="5" height="1" fill="#000000"/>
</svg>
