<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER: original PDF-document illustration pending user-approved artwork. -->
<!-- Platinum PDF document icon, 16x16.

     Our own 16x16 drawing in the Platinum palette: the generic
     document's page (a #FFFFFF page with a 1px #000000 outline and a
     #DDDDDD folded top-right corner) under a grey text line and a black
     seal plate with a #DDDDDD face. Drawn for this theme, not traced
     from anyone's artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Page outline with the top-right corner cut away. -->
  <path d="M3 1 h7 l3 3 v10 H3 Z" fill="#000000"/>
  <!-- White page, inset one pixel. -->
  <path d="M4 2 h5 l3 3 v8 H4 Z" fill="#FFFFFF"/>
  <!-- Folded corner flap. -->
  <path d="M9 2 L12 2 L12 5 Z" fill="#DDDDDD"/>
  <!-- Text line. -->
  <rect x="5" y="6" width="6" height="1" fill="#999999"/>
  <!-- Seal plate. -->
  <rect x="7" y="8" width="5" height="5" fill="#000000"/>
  <!-- Seal face. -->
  <rect x="8" y="9" width="3" height="3" fill="#DDDDDD"/>
</svg>
