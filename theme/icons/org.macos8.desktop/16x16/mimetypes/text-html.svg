<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER: original web-document illustration pending user-approved artwork. -->
<!-- Platinum web-document icon, 16x16.

     Our own 16x16 drawing in the Platinum palette: a small window with a
     #000000 outline, a #DDDDDD title bar with a #FFFFFF highlight and one
     #999999 stripe, a #FFFFFF body and a black globe (a ring with a black
     equator and meridian). Drawn for this theme, not traced from anyone's
     artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Window outline. -->
  <rect x="1" y="2" width="14" height="12" fill="#000000"/>
  <!-- Title bar face. -->
  <rect x="2" y="3" width="12" height="3" fill="#DDDDDD"/>
  <!-- Title bar highlight. -->
  <rect x="2" y="3" width="12" height="1" fill="#FFFFFF"/>
  <!-- Title bar stripe. -->
  <rect x="4" y="4" width="8" height="1" fill="#999999"/>
  <!-- White body. -->
  <rect x="2" y="7" width="12" height="6" fill="#FFFFFF"/>
  <!-- Globe ring, outer and inner. -->
  <circle cx="8" cy="10" r="2" fill="#000000"/>
  <circle cx="8" cy="10" r="1" fill="#FFFFFF"/>
  <!-- Globe equator. -->
  <rect x="6" y="10" width="5" height="1" fill="#000000"/>
  <!-- Globe meridian. -->
  <rect x="8" y="8" width="1" height="4" fill="#000000"/>
</svg>
