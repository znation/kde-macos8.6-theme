<!-- PLACEHOLDER: original blank-document illustration pending user-approved artwork. -->
<!-- Our own 16x16 blank document in the Platinum palette: the generic document's
     page without its text lines, shared by the untyped and empty file names.
     Drawn for this theme, not traced from Apple's artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Page outline with the top-right corner cut away. -->
  <path d="M3 1 h7 l3 3 v10 H3 Z" fill="#000000"/>
  <!-- White page, inset one pixel. -->
  <path d="M4 2 h5 l3 3 v8 H4 Z" fill="#FFFFFF"/>
  <!-- Folded corner flap. -->
  <path d="M9 2 L12 2 L12 5 Z" fill="#DDDDDD"/>
</svg>
