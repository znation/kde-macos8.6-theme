<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER: original Ogg multimedia-container illustration pending user-approved artwork. -->
<!-- Platinum Ogg multimedia-container icon, 16x16.

     Our own 16x16 drawing in the Platinum palette: the generic document's
     page with a black film-strip band, two rows of white sprocket holes
     around a white frame window. Drawn for this theme, not traced from
     anyone's artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Page outline with the top-right corner cut away. -->
  <path d="M3 1 h7 l3 3 v10 H3 Z" fill="#000000"/>
  <!-- White page, inset one pixel. -->
  <path d="M4 2 h5 l3 3 v8 H4 Z" fill="#FFFFFF"/>
  <!-- Folded corner flap. -->
  <path d="M9 2 L12 2 L12 5 Z" fill="#DDDDDD"/>
  <!-- Film-strip band. -->
  <rect x="5" y="6" width="6" height="6" fill="#000000"/>
  <!-- Upper sprocket holes. -->
  <rect x="6" y="7" width="1" height="1" fill="#FFFFFF"/>
  <rect x="8" y="7" width="1" height="1" fill="#FFFFFF"/>
  <!-- Frame window. -->
  <rect x="6" y="8" width="4" height="2" fill="#FFFFFF"/>
  <!-- Lower sprocket holes. -->
  <rect x="6" y="10" width="1" height="1" fill="#FFFFFF"/>
  <rect x="8" y="10" width="1" height="1" fill="#FFFFFF"/>
</svg>
