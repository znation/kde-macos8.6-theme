<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER: original contact-book illustration pending user-approved artwork. -->
<!-- Platinum x-office-address-book icon, 16x16.

     Our own drawing in the Platinum palette: a closed address book with
     a black outline, grey cover face, white top and spine bevels, grey
     right and bottom bevels, a dark name heading and ruled entry lines.
     Drawn for this theme, not traced from anyone's artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Book outline. -->
  <rect x="1" y="1" width="14" height="14" fill="#000000"/>
  <!-- Cover face. -->
  <rect x="2" y="2" width="12" height="12" fill="#DDDDDD"/>
  <!-- Top bevel. -->
  <rect x="2" y="2" width="12" height="1" fill="#FFFFFF"/>
  <!-- Spine bevel. -->
  <rect x="2" y="2" width="1" height="12" fill="#FFFFFF"/>
  <!-- Right bevel. -->
  <rect x="13" y="2" width="1" height="12" fill="#999999"/>
  <!-- Bottom bevel. -->
  <rect x="2" y="13" width="12" height="1" fill="#999999"/>
  <!-- Name heading. -->
  <rect x="4" y="4" width="7" height="1" fill="#000000"/>
  <!-- Ruled entry lines. -->
  <rect x="4" y="6" width="9" height="1" fill="#000000"/>
  <rect x="4" y="8" width="6" height="1" fill="#000000"/>
  <rect x="4" y="10" width="9" height="1" fill="#000000"/>
  <rect x="4" y="12" width="5" height="1" fill="#000000"/>
</svg>
