<!-- PLACEHOLDER: original JSON illustration pending user-approved artwork. -->
<!-- Platinum JSON-document icon, 16x16 rendition.

     Our own 16x16 drawing in the Platinum palette: the generic document's
     page with two black curly braces and no code lines. Drawn for this
     theme, not traced from anyone's artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Page outline with the top-right corner cut away. -->
  <path d="M3 1 h7 l3 3 v10 H3 Z" fill="#000000"/>
  <!-- White page, inset one pixel. -->
  <path d="M4 2 h5 l3 3 v8 H4 Z" fill="#FFFFFF"/>
  <!-- Folded corner flap. -->
  <path d="M9 2 L12 2 L12 5 Z" fill="#DDDDDD"/>
  <!-- Left curly brace. -->
  <rect x="6" y="6" width="1" height="1" fill="#000000"/>
  <rect x="5" y="7" width="1" height="1" fill="#000000"/>
  <rect x="4" y="8" width="1" height="1" fill="#000000"/>
  <rect x="5" y="8" width="1" height="1" fill="#000000"/>
  <rect x="5" y="9" width="1" height="1" fill="#000000"/>
  <rect x="6" y="10" width="1" height="1" fill="#000000"/>
  <!-- Right curly brace. -->
  <rect x="9" y="6" width="1" height="1" fill="#000000"/>
  <rect x="10" y="7" width="1" height="1" fill="#000000"/>
  <rect x="11" y="8" width="1" height="1" fill="#000000"/>
  <rect x="10" y="8" width="1" height="1" fill="#000000"/>
  <rect x="10" y="9" width="1" height="1" fill="#000000"/>
  <rect x="9" y="10" width="1" height="1" fill="#000000"/>
</svg>
