<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER: original gzip-archive illustration pending user-approved artwork. -->
<!-- Platinum gzip-archive icon, 16x16 rendition.

     Our own 16x16 redraw in the Platinum palette: the sealed package
     box (a black outline, a #DDDDDD lid band with a white top row, a
     white body and a grey tape stripe) holding a downward arrow on the
     white face, left of the tape. Drawn for this theme, not traced
     from anyone's artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Sealed package box, shared with package-x-generic. -->
  <rect x="1" y="3" width="14" height="11" fill="#000000"/>
  <rect x="2" y="4" width="12" height="2" fill="#DDDDDD"/>
  <rect x="2" y="4" width="12" height="1" fill="#FFFFFF"/>
  <rect x="2" y="6" width="12" height="7" fill="#FFFFFF"/>
  <rect x="7" y="6" width="2" height="7" fill="#999999"/>
  <!-- Downward arrow. -->
  <rect x="3" y="7" width="2" height="3" fill="#000000"/>
  <rect x="2" y="10" width="4" height="1" fill="#000000"/>
  <rect x="3" y="11" width="2" height="1" fill="#000000"/>
</svg>
