<!-- PLACEHOLDER: original image illustration pending user-approved artwork. -->
<!-- Platinum image icon, 16x16.

     Our own 16x16 drawing in the Platinum palette: a framed photograph —
     a #000000 frame, a #DDDDDD matte, #FFFFFF photo paper, a #999999 sun,
     a #999999 mountain staircase and a #999999 ground band. Drawn for this
     theme, not traced from anyone's artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Frame. -->
  <rect x="1" y="1" width="14" height="14" fill="#000000"/>
  <!-- Matte. -->
  <rect x="2" y="2" width="12" height="12" fill="#DDDDDD"/>
  <!-- Photo paper. -->
  <rect x="3" y="3" width="10" height="10" fill="#FFFFFF"/>
  <!-- Sun. -->
  <rect x="10" y="4" width="2" height="2" fill="#999999"/>
  <!-- Mountain staircase. -->
  <rect x="3" y="8" width="2" height="2" fill="#999999"/>
  <rect x="5" y="7" width="2" height="3" fill="#999999"/>
  <rect x="7" y="6" width="2" height="4" fill="#999999"/>
  <rect x="9" y="8" width="2" height="2" fill="#999999"/>
  <!-- Ground band. -->
  <rect x="3" y="10" width="10" height="3" fill="#999999"/>
</svg>
