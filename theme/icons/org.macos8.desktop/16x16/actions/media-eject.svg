<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER: original eject-glyph illustration pending user-approved artwork. -->
<!-- Mac OS 8.6 "Platinum" eject glyph.

     Our own drawing in the Platinum palette, not traced from anyone's
     artwork: a filled black triangle above a filled black bar, the two
     sharing the same horizontal extent and centre so the glyph reads as
     one mark. No reference screenshot shows an eject glyph, so no
     reference pixels are used and the drawing is this theme's own
     choice. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <path d="M4 9 L12 9 L8 4 Z" fill="#000000"/>
  <rect x="4" y="11" width="8" height="2" fill="#000000"/>
</svg>
