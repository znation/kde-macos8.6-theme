<!-- Platinum network server icon, 16x16.

     Our own 16x16 drawing in the Platinum palette: a raised chassis
     with a black outline, a white/#999999 bevel, two black drive-bay
     slots on the front and a grey indicator light below them. Drawn
     for this theme, not traced from anyone's artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <rect x="4" y="1" width="8" height="14" fill="#000000"/>
  <rect x="5" y="2" width="6" height="12" fill="#DDDDDD"/>
  <rect x="5" y="2" width="6" height="1" fill="#FFFFFF"/>
  <rect x="5" y="2" width="1" height="12" fill="#FFFFFF"/>
  <rect x="10" y="2" width="1" height="12" fill="#999999"/>
  <rect x="5" y="13" width="6" height="1" fill="#999999"/>
  <rect x="6" y="5" width="4" height="2" fill="#000000"/>
  <rect x="6" y="9" width="4" height="2" fill="#000000"/>
  <rect x="6" y="11" width="1" height="1" fill="#999999"/>
</svg>
