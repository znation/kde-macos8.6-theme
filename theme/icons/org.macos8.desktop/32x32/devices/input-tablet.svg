  <rect x="3" y="24" width="26" height="1" fill="#999999"/>
  <rect x="28" y="7" width="1" height="18" fill="#999999"/>
  <rect x="6" y="10" width="14" height="12" fill="#000000"/>
  <rect x="7" y="11" width="12" height="10" fill="#FFFFFF"/>
