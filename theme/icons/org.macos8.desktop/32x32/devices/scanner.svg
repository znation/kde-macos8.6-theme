<!-- Platinum scanner icon, 32x32.

     Our own 32x32 drawing in the Platinum palette: a flatbed scanner
     seen from above, a landscape body with the 1px #000000 outline,
     #DDDDDD fill, white top row and left column and #999999 bottom row
     and right column, a closed lid holding a white glass strip with a
     black scan-lamp bar sweeping it, and a black status LED below the
     glass.
     Drawn for this theme, not traced from anyone's artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <rect x="3" y="8" width="26" height="18" fill="#000000"/>
  <rect x="4" y="9" width="24" height="16" fill="#DDDDDD"/>
  <rect x="4" y="9" width="24" height="1" fill="#FFFFFF"/>
  <rect x="4" y="9" width="1" height="16" fill="#FFFFFF"/>
  <rect x="4" y="24" width="24" height="1" fill="#999999"/>
  <rect x="27" y="9" width="1" height="16" fill="#999999"/>
  <rect x="7" y="12" width="18" height="8" fill="#000000"/>
  <rect x="8" y="13" width="16" height="6" fill="#FFFFFF"/>
  <rect x="10" y="16" width="12" height="2" fill="#000000"/>
  <rect x="5" y="21" width="2" height="2" fill="#000000"/>
</svg>
