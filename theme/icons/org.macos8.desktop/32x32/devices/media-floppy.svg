<!-- PLACEHOLDER: original floppy-disk illustration pending user-approved artwork. -->
<!-- Platinum floppy-disk icon, 32x32.

     Our own 32x32 drawing in the Platinum palette: a square disk seen
     from the front, with a black outline, a #DDDDDD body with a white
     top row and left column and a #999999 bottom row and right column,
     a metal shutter window with a slot at the top, and a white label
     plate outlined in black at the bottom carrying a label line.
     Drawn for this theme, not traced from anyone's artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <rect x="3" y="3" width="26" height="26" fill="#000000"/>
  <rect x="4" y="4" width="24" height="24" fill="#DDDDDD"/>
  <rect x="4" y="4" width="24" height="1" fill="#FFFFFF"/>
  <rect x="4" y="4" width="1" height="24" fill="#FFFFFF"/>
  <rect x="4" y="27" width="24" height="1" fill="#999999"/>
  <rect x="27" y="4" width="1" height="24" fill="#999999"/>
  <rect x="12" y="6" width="12" height="7" fill="#000000"/>
  <rect x="13" y="7" width="10" height="5" fill="#DDDDDD"/>
  <rect x="17" y="7" width="2" height="5" fill="#000000"/>
  <rect x="8" y="16" width="16" height="10" fill="#000000"/>
  <rect x="9" y="17" width="14" height="8" fill="#FFFFFF"/>
  <rect x="11" y="19" width="10" height="1" fill="#999999"/>
</svg>
