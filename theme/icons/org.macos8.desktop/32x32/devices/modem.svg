<!-- Platinum modem icon, 32x32.

     Our own 32x32 drawing in the Platinum palette: an external modem
     seen from the front, with a black outline, a #DDDDDD body with a
     white top row and left column and a #999999 bottom row and right
     column, a telephone jack on the right, and a row of black
     indicator LEDs along the front.
     Drawn for this theme, not traced from anyone's artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <rect x="3" y="8" width="26" height="18" fill="#000000"/>
  <rect x="4" y="9" width="24" height="16" fill="#DDDDDD"/>
  <rect x="4" y="9" width="24" height="1" fill="#FFFFFF"/>
  <rect x="4" y="9" width="1" height="16" fill="#FFFFFF"/>
  <rect x="4" y="24" width="24" height="1" fill="#999999"/>
  <rect x="27" y="9" width="1" height="16" fill="#999999"/>
  <rect x="21" y="11" width="5" height="3" fill="#000000"/>
  <rect x="22" y="12" width="3" height="1" fill="#FFFFFF"/>
  <rect x="7" y="20" width="2" height="2" fill="#000000"/>
  <rect x="11" y="20" width="2" height="2" fill="#000000"/>
  <rect x="15" y="20" width="2" height="2" fill="#000000"/>
</svg>
