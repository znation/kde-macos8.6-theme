<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER: original removable-drive illustration pending user-approved artwork. -->
<!-- Platinum removable-media drive icon.

     Our own 32x32 drawing in the Platinum palette, not traced from anyone's
     artwork: the hard disk's body and bevel, with a media slot (black, with a
     white lower lip) and a black eject button in place of the label plate and
     light. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Body outline and #DDDDDD face. -->
  <rect x="3" y="8" width="26" height="17" fill="#000000"/>
  <rect x="4" y="9" width="24" height="15" fill="#DDDDDD"/>
  <!-- Platinum bevel: white along the top and left, grey along the bottom
       and right. -->
  <rect x="4" y="9" width="24" height="2" fill="#FFFFFF"/>
  <rect x="4" y="9" width="1" height="15" fill="#FFFFFF"/>
  <rect x="4" y="22" width="24" height="2" fill="#999999"/>
  <rect x="27" y="9" width="1" height="15" fill="#999999"/>
  <!-- Media slot with its white lower lip. -->
  <rect x="7" y="13" width="18" height="2" fill="#000000"/>
  <rect x="7" y="15" width="18" height="1" fill="#FFFFFF"/>
  <!-- Eject button. -->
  <rect x="21" y="18" width="4" height="2" fill="#000000"/>
</svg>
