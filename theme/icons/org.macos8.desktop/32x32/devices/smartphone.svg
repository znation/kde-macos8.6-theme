<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER: original smartphone illustration pending user-approved artwork. -->
<!-- Platinum smartphone icon, 32x32.

     Our own 32x32 drawing in the Platinum palette, shared with the
     phone icon: an upright smartphone
     with a raised #DDDDDD body, a 1px #000000 outline and the Platinum
     bevel (#FFFFFF top and left, #999999 bottom and right), a black
     screen, a black speaker slot above the screen and a black home
     button below it. Drawn for this theme, not traced from anyone's
     artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Body outline and #DDDDDD face. -->
  <rect x="9" y="2" width="14" height="28" fill="#000000"/>
  <rect x="10" y="3" width="12" height="26" fill="#DDDDDD"/>
  <!-- Platinum bevel: white along the top and left, grey along the bottom
       and right. -->
  <rect x="10" y="3" width="12" height="1" fill="#FFFFFF"/>
  <rect x="10" y="3" width="1" height="26" fill="#FFFFFF"/>
  <rect x="10" y="28" width="12" height="1" fill="#999999"/>
  <rect x="21" y="3" width="1" height="26" fill="#999999"/>
  <!-- Screen. -->
  <rect x="11" y="7" width="10" height="14" fill="#000000"/>
  <!-- Speaker slot. -->
  <rect x="14" y="5" width="4" height="1" fill="#000000"/>
  <!-- Home button. -->
  <rect x="15" y="24" width="2" height="2" fill="#000000"/>
</svg>
