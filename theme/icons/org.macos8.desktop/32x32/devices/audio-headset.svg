<!-- Platinum headset icon, 32x32.

     Our own 32x32 drawing in the Platinum palette: a headset seen from
     the front, with a straight headband across the top (black outline,
     #DDDDDD fill, white top row and left column, #999999 bottom row and
     right column), two ear cups hanging below the band's ends with an
     inner pad in each, and a mic boom running under the left cup to a
     mic tip at its right end with a white highlight.
     Drawn for this theme, not traced from anyone's artwork. -->
