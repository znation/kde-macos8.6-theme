<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER: original desktop-computer illustration pending user-approved artwork. -->
<!-- Platinum desktop computer icon, 32x32.

     Our own 32x32 drawing in the Platinum palette: a monitor with a
     #DDDDDD face, 1px #000000 outline and the Platinum bevel
     (#FFFFFF top/left, #999999 bottom/right) over a #000000 screen with
     a white glint, and a desktop case with the same bevel, a #000000
     drive slot and a #000000 power light. Drawn for this theme, not
     traced from anyone's artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Monitor outline and #DDDDDD face. -->
  <rect x="4" y="2" width="24" height="18" fill="#000000"/>
  <rect x="5" y="3" width="22" height="16" fill="#DDDDDD"/>
  <!-- Platinum bevel: white along the top and left, grey along the bottom
       and right. -->
  <rect x="5" y="3" width="22" height="2" fill="#FFFFFF"/>
  <rect x="5" y="3" width="1" height="16" fill="#FFFFFF"/>
  <rect x="5" y="17" width="22" height="2" fill="#999999"/>
  <rect x="26" y="3" width="1" height="16" fill="#999999"/>
  <!-- Screen. -->
  <rect x="8" y="6" width="16" height="10" fill="#000000"/>
  <!-- Screen glints. -->
  <rect x="10" y="8" width="6" height="2" fill="#FFFFFF"/>
  <rect x="10" y="12" width="4" height="1" fill="#999999"/>
  <!-- Stand neck. -->
  <rect x="14" y="20" width="4" height="1" fill="#000000"/>
  <!-- Case outline and #DDDDDD face. -->
  <rect x="10" y="21" width="12" height="9" fill="#000000"/>
  <rect x="11" y="22" width="10" height="7" fill="#DDDDDD"/>
  <rect x="11" y="22" width="10" height="1" fill="#FFFFFF"/>
  <rect x="11" y="22" width="1" height="7" fill="#FFFFFF"/>
  <rect x="11" y="28" width="10" height="1" fill="#999999"/>
  <rect x="20" y="22" width="1" height="7" fill="#999999"/>
  <!-- Drive slot. -->
  <rect x="13" y="25" width="5" height="2" fill="#000000"/>
  <!-- Power light. -->
  <circle cx="19" cy="26" r="1" fill="#000000"/>
</svg>
