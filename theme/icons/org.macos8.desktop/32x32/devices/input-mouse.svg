<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER: original mouse illustration pending user-approved artwork. -->
<!-- Mac OS 8.6 "Platinum" input-mouse icon.

     Our own 32x32 drawing in the Platinum palette: a black-outlined rounded
     mouse body with a #DDDDDD face, a white two-button band across the top, a
     black split between the buttons and a black scroll wheel below the band.
     Drawn for this theme, not traced from anyone's artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Body outline. -->
  <rect x="7" y="5" width="18" height="22" rx="9" fill="#000000"/>
  <!-- Body face. -->
  <rect x="8" y="6" width="16" height="20" rx="8" fill="#DDDDDD"/>
  <!-- Two-button band. -->
  <rect x="8" y="6" width="16" height="7" fill="#FFFFFF"/>
  <!-- Split between the buttons. -->
  <rect x="15" y="6" width="2" height="7" fill="#000000"/>
  <!-- Scroll wheel. -->
  <rect x="14" y="13" width="4" height="7" rx="2" fill="#000000"/>
</svg>
