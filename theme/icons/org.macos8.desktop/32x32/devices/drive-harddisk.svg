<?xml version="1.0" encoding="UTF-8"?>
<!-- Mac OS 8.6 "Platinum" hard-disk icon.

     Our own 32x32 drawing in the Platinum palette: a #DDDDDD drive body with
     a 1px #000000 outline and the Platinum bevel (#FFFFFF top/left, #999999
     bottom/right), a white label plate and a black activity light. Drawn for
     this theme, not traced from Apple's artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Body outline and #DDDDDD face. -->
  <rect x="3" y="8" width="26" height="17" fill="#000000"/>
  <rect x="4" y="9" width="24" height="15" fill="#DDDDDD"/>
  <!-- Platinum bevel: white along the top and left, grey along the bottom
       and right. -->
  <rect x="4" y="9" width="24" height="2" fill="#FFFFFF"/>
  <rect x="4" y="9" width="1" height="15" fill="#FFFFFF"/>
  <rect x="4" y="22" width="24" height="2" fill="#999999"/>
  <rect x="27" y="9" width="1" height="15" fill="#999999"/>
  <!-- Front label plate. -->
  <rect x="6" y="14" width="14" height="6" fill="#000000"/>
  <rect x="7" y="15" width="12" height="4" fill="#FFFFFF"/>
  <!-- Activity light. -->
  <circle cx="24" cy="17" r="2" fill="#000000"/>
</svg>
