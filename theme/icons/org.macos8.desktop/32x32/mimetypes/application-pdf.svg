<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER: original PDF-document illustration pending user-approved artwork. -->
<!-- Platinum PDF document icon, 32x32.

     Our own 32x32 drawing in the Platinum palette: the generic
     document's page (a #FFFFFF page with a 1px #000000 outline and a
     #DDDDDD folded top-right corner) under grey text lines and a black
     seal plate with a #DDDDDD face. Drawn for this theme, not traced
     from anyone's artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Page outline with the top-right corner cut away. -->
  <path d="M6 3 h14 l6 6 v20 H6 Z" fill="#000000"/>
  <!-- White page, inset one pixel. -->
  <path d="M7 4 h12 l6 6 v18 H7 Z" fill="#FFFFFF"/>
  <!-- Folded corner flap. -->
  <path d="M19 4 L25 4 L25 10 Z" fill="#DDDDDD"/>
  <!-- Text lines. -->
  <rect x="10" y="12" width="12" height="1" fill="#999999"/>
  <rect x="10" y="15" width="8" height="1" fill="#999999"/>
  <!-- Seal plate. -->
  <rect x="16" y="18" width="8" height="8" fill="#000000"/>
  <!-- Seal face. -->
  <rect x="17" y="19" width="6" height="6" fill="#DDDDDD"/>
</svg>
