<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER: original QCOW disk-image illustration pending user-approved artwork. -->
<!-- Platinum QCOW disk-image icon, 32x32.

     Our own 32x32 drawing in the Platinum palette: the optical disc the
     media-optical icon draws, with a white Q on the grey face — the
     copy-on-write image's initial and the first byte of the type's QFI
     magic. The Q is off-centre with a tail, so the mark stays distinct
     from the ISO disc's capital I with its glints and hub rings. Drawn
     for this theme, not traced from anyone's artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <circle cx="16" cy="16" r="14" fill="#000000"/>
  <circle cx="16" cy="16" r="13" fill="#DDDDDD"/>
  <circle cx="13" cy="13" r="5" fill="#FFFFFF"/>
  <circle cx="13" cy="13" r="3" fill="#DDDDDD"/>
  <rect x="16" y="16" width="2" height="2" fill="#FFFFFF"/>
</svg>
