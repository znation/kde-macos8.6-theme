<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER: original Android-package illustration pending user-approved artwork. -->
<!-- Platinum Android-package icon, 32x32.

     Our own 32x32 drawing in the Platinum palette: the document drawing
     (a #FFFFFF page with a 1px #000000 outline and a #DDDDDD folded
     top-right corner) with the text lines replaced by a black band
     holding interlocked white zipper teeth. Drawn for this theme, not
     traced from anyone's artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Page outline with the top-right corner cut away. -->
  <path d="M6 3 h14 l6 6 v20 H6 Z" fill="#000000"/>
  <!-- White page, inset one pixel. -->
  <path d="M7 4 h12 l6 6 v18 H7 Z" fill="#FFFFFF"/>
  <!-- Folded corner flap. -->
  <path d="M19 4 L25 4 L25 10 Z" fill="#DDDDDD"/>
  <!-- Zipper band. -->
  <rect x="10" y="15" width="12" height="7" fill="#000000"/>
  <!-- Zipper teeth, whole-pixel cells staggered across the band's
       center line. -->
  <rect x="14" y="15" width="2" height="1" fill="#FFFFFF"/>
  <rect x="14" y="17" width="2" height="1" fill="#FFFFFF"/>
  <rect x="14" y="19" width="2" height="1" fill="#FFFFFF"/>
  <rect x="14" y="21" width="2" height="1" fill="#FFFFFF"/>
  <rect x="16" y="16" width="2" height="1" fill="#FFFFFF"/>
  <rect x="16" y="18" width="2" height="1" fill="#FFFFFF"/>
  <rect x="16" y="20" width="2" height="1" fill="#FFFFFF"/>
</svg>
