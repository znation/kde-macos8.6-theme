<!-- PLACEHOLDER: original audio illustration pending user-approved artwork. -->
<!-- Platinum audio icon, 32x32.

     Our own 32x32 drawing in the Platinum palette: a beamed pair of
     eighth notes with two #000000 note heads, two #000000 stems and one
     #000000 beam. Drawn for this theme, not traced from anyone's
     artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Left note head. -->
  <rect x="6" y="23" width="7" height="4" fill="#000000"/>
  <!-- Left stem. -->
  <rect x="11" y="6" width="2" height="21" fill="#000000"/>
  <!-- Right note head. -->
  <rect x="18" y="21" width="7" height="4" fill="#000000"/>
  <!-- Right stem. -->
  <rect x="23" y="6" width="2" height="19" fill="#000000"/>
  <!-- Beam. -->
  <rect x="11" y="6" width="14" height="5" fill="#000000"/>
</svg>
