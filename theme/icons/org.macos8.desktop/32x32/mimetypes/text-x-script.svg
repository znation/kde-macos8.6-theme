<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER: original script illustration pending user-approved artwork. -->
<!-- Platinum script icon, 32x32.

     Our own 32x32 drawing in the Platinum palette: the generic document's
     page with two black angle brackets and #999999 code lines. Drawn for
     this theme, not traced from anyone's artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Page outline with the top-right corner cut away. -->
  <path d="M6 3 h14 l6 6 v20 H6 Z" fill="#000000"/>
  <!-- White page, inset one pixel. -->
  <path d="M7 4 h12 l6 6 v18 H7 Z" fill="#FFFFFF"/>
  <!-- Folded corner flap. -->
  <path d="M19 4 L25 4 L25 10 Z" fill="#DDDDDD"/>
  <!-- Left angle bracket. -->
  <rect x="12" y="11" width="2" height="2" fill="#000000"/>
  <rect x="10" y="13" width="2" height="2" fill="#000000"/>
  <rect x="8" y="15" width="2" height="2" fill="#000000"/>
  <rect x="10" y="17" width="2" height="2" fill="#000000"/>
  <rect x="12" y="19" width="2" height="2" fill="#000000"/>
  <!-- Right angle bracket. -->
  <rect x="18" y="11" width="2" height="2" fill="#000000"/>
  <rect x="20" y="13" width="2" height="2" fill="#000000"/>
  <rect x="22" y="15" width="2" height="2" fill="#000000"/>
  <rect x="20" y="17" width="2" height="2" fill="#000000"/>
  <rect x="18" y="19" width="2" height="2" fill="#000000"/>
  <!-- Code lines. -->
  <rect x="10" y="23" width="12" height="1" fill="#999999"/>
  <rect x="10" y="25" width="8" height="1" fill="#999999"/>
</svg>
