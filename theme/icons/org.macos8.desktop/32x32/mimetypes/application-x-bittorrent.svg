<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER: original BitTorrent-file illustration pending user-approved artwork. -->
<!-- Platinum BitTorrent-file icon, 32x32.

     Our own 32x32 drawing in the Platinum palette: the generic document's
     page with its text lines replaced by a black band holding a white
     download arrow over a tray. Drawn for this theme, not traced from
     anyone's artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Page outline with the top-right corner cut away. -->
  <path d="M6 3 h14 l6 6 v20 H6 Z" fill="#000000"/>
  <!-- White page, inset one pixel. -->
  <path d="M7 4 h12 l6 6 v18 H7 Z" fill="#FFFFFF"/>
  <!-- Folded corner flap. -->
  <path d="M19 4 L25 4 L25 10 Z" fill="#DDDDDD"/>
  <!-- Download band. -->
  <rect x="10" y="15" width="12" height="7" fill="#000000"/>
  <!-- Download arrow, whole-pixel cells. -->
  <rect x="15" y="16" width="2" height="2" fill="#FFFFFF"/>
  <rect x="14" y="18" width="4" height="1" fill="#FFFFFF"/>
  <rect x="15" y="19" width="2" height="1" fill="#FFFFFF"/>
  <!-- Tray. -->
  <rect x="12" y="21" width="8" height="1" fill="#FFFFFF"/>
</svg>
