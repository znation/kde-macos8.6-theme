<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER: original envelope illustration pending user-approved artwork. -->
<!-- Platinum mail icon, 32x32.

     Our own 32x32 drawing in the Platinum palette: an envelope with a
     #000000 outline, a #DDDDDD face and a black flap band drawn as a
     filled V from the face's top corners to its centre, its interior
     left #DDDDDD so the band stays 1px thick. Drawn for this theme, not
     traced from anyone's artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Envelope outline. -->
  <rect x="2" y="6" width="28" height="20" fill="#000000"/>
  <!-- Envelope face. -->
  <rect x="3" y="7" width="26" height="18" fill="#DDDDDD"/>
  <!-- Flap band, from the face's top corners to its centre. -->
  <path d="M3 7 L16 17 L29 7 Z" fill="#000000"/>
  <!-- Flap interior, leaving the band 1px thick. -->
  <path d="M4 8 L16 16 L28 8 Z" fill="#DDDDDD"/>
</svg>
