<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER: original PKCS#12 certificate-bundle illustration pending user-approved artwork. -->
<!-- Platinum PKCS#12 certificate-bundle icon, 32x32.

     Our own 32x32 drawing in the Platinum palette: the document
     drawing (a #FFFFFF page with a 1px #000000 outline and a #DDDDDD
     folded top-right corner) with the text lines replaced by a black
     padlock, a shackle over a locked body with a keyhole. Drawn
     for this theme, not traced from anyone's artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Page outline with the top-right corner cut away. -->
  <path d="M6 3 h14 l6 6 v20 H6 Z" fill="#000000"/>
  <!-- White page, inset one pixel. -->
  <path d="M7 4 h12 l6 6 v18 H7 Z" fill="#FFFFFF"/>
  <!-- Folded corner flap. -->
  <path d="M19 4 L25 4 L25 10 Z" fill="#DDDDDD"/>
  <!-- Padlock: shackle over the body, keyhole on the face. -->
  <rect x="13" y="11" width="6" height="1" fill="#000000"/>
  <rect x="13" y="11" width="1" height="4" fill="#000000"/>
  <rect x="18" y="11" width="1" height="4" fill="#000000"/>
  <rect x="12" y="15" width="8" height="7" fill="#000000"/>
  <rect x="13" y="16" width="6" height="5" fill="#DDDDDD"/>
  <rect x="15" y="17" width="2" height="3" fill="#000000"/>
</svg>
