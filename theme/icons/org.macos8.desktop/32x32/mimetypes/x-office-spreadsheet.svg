<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER: original office-spreadsheet illustration pending user-approved artwork. -->
<!-- Platinum office-spreadsheet icon, 32x32.

     Our own 32x32 drawing in the Platinum palette: the generic document's
     page (black outline, white page and folded corner) holding a
     spreadsheet table with a black frame, a white cell field, a grey
     heading row and grey column and row rules. Drawn for this theme, not
     traced from anyone's artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Page outline with the top-right corner cut away. -->
  <path d="M6 3 h14 l6 6 v20 H6 Z" fill="#000000"/>
  <!-- White page, inset one pixel. -->
  <path d="M7 4 h12 l6 6 v18 H7 Z" fill="#FFFFFF"/>
  <!-- Folded corner flap. -->
  <path d="M19 4 L25 4 L25 10 Z" fill="#DDDDDD"/>
  <!-- Table frame. -->
  <rect x="9" y="12" width="14" height="13" fill="#000000"/>
  <!-- Cell field. -->
  <rect x="10" y="13" width="12" height="11" fill="#FFFFFF"/>
  <!-- Heading row. -->
  <rect x="10" y="13" width="12" height="2" fill="#DDDDDD"/>
  <!-- Column rules. -->
  <rect x="14" y="15" width="1" height="9" fill="#999999"/>
  <rect x="19" y="15" width="1" height="9" fill="#999999"/>
  <!-- Row rules. -->
  <rect x="10" y="18" width="12" height="1" fill="#999999"/>
  <rect x="10" y="21" width="12" height="1" fill="#999999"/>
</svg>
