<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER: original Ogg multimedia-container illustration pending user-approved artwork. -->
<!-- Platinum Ogg multimedia-container icon, 32x32.

     Our own 32x32 drawing in the Platinum palette: the generic document's
     page with a black film-strip band, two rows of white sprocket holes
     around a white frame window. Drawn for this theme, not traced from
     anyone's artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Page outline with the top-right corner cut away. -->
  <path d="M6 3 h14 l6 6 v20 H6 Z" fill="#000000"/>
  <!-- White page, inset one pixel. -->
  <path d="M7 4 h12 l6 6 v18 H7 Z" fill="#FFFFFF"/>
  <!-- Folded corner flap. -->
  <path d="M19 4 L25 4 L25 10 Z" fill="#DDDDDD"/>
  <!-- Film-strip band. -->
  <rect x="9" y="14" width="14" height="8" fill="#000000"/>
  <!-- Upper sprocket holes. -->
  <rect x="10" y="15" width="2" height="1" fill="#FFFFFF"/>
  <rect x="13" y="15" width="2" height="1" fill="#FFFFFF"/>
  <rect x="16" y="15" width="2" height="1" fill="#FFFFFF"/>
  <rect x="19" y="15" width="2" height="1" fill="#FFFFFF"/>
  <!-- Frame window. -->
  <rect x="11" y="17" width="10" height="2" fill="#FFFFFF"/>
  <!-- Lower sprocket holes. -->
  <rect x="10" y="20" width="2" height="1" fill="#FFFFFF"/>
  <rect x="13" y="20" width="2" height="1" fill="#FFFFFF"/>
  <rect x="16" y="20" width="2" height="1" fill="#FFFFFF"/>
  <rect x="19" y="20" width="2" height="1" fill="#FFFFFF"/>
</svg>
