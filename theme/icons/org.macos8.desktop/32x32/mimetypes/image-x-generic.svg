<!-- Platinum image icon, 32x32.

     Our own 32x32 drawing in the Platinum palette: a framed photograph —
     a #000000 frame, a #DDDDDD matte, #FFFFFF photo paper, a #999999 sun,
     a #999999 mountain staircase and a #999999 ground band. Drawn for this
     theme, not traced from anyone's artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Frame. -->
  <rect x="3" y="3" width="26" height="26" fill="#000000"/>
  <!-- Matte. -->
  <rect x="4" y="4" width="24" height="24" fill="#DDDDDD"/>
  <!-- Photo paper. -->
  <rect x="6" y="6" width="20" height="20" fill="#FFFFFF"/>
  <!-- Sun. -->
  <rect x="21" y="9" width="3" height="3" fill="#999999"/>
  <!-- Mountain staircase. -->
  <rect x="6" y="18" width="4" height="3" fill="#999999"/>
  <rect x="10" y="16" width="4" height="5" fill="#999999"/>
  <rect x="14" y="14" width="4" height="7" fill="#999999"/>
  <rect x="18" y="16" width="4" height="5" fill="#999999"/>
  <rect x="22" y="18" width="4" height="3" fill="#999999"/>
  <!-- Ground band. -->
  <rect x="6" y="21" width="20" height="5" fill="#999999"/>
</svg>
