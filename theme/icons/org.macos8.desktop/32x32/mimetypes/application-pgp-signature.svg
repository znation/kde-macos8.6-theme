<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER: original detached OpenPGP-signature illustration pending user-approved artwork. -->
<!-- Platinum detached-signature icon, 32x32.

     Our own 32x32 drawing in the Platinum palette: the document drawing
     (a #FFFFFF page with a 1px #000000 outline and a #DDDDDD folded
     top-right corner) with the text lines replaced by a black signature
     stroke stepping down and up across the page's foot over a straight
     underline. Drawn for this theme, not traced from anyone's artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Page outline with the top-right corner cut away. -->
  <path d="M6 3 h14 l6 6 v20 H6 Z" fill="#000000"/>
  <!-- White page, inset one pixel. -->
  <path d="M7 4 h12 l6 6 v18 H7 Z" fill="#FFFFFF"/>
  <!-- Folded corner flap. -->
  <path d="M19 4 L25 4 L25 10 Z" fill="#DDDDDD"/>
  <!-- Signature stroke, whole-pixel cells. -->
  <rect x="9" y="18" width="3" height="1" fill="#000000"/>
  <rect x="12" y="17" width="3" height="1" fill="#000000"/>
  <rect x="15" y="18" width="3" height="1" fill="#000000"/>
  <rect x="18" y="17" width="3" height="1" fill="#000000"/>
  <rect x="21" y="18" width="2" height="1" fill="#000000"/>
  <!-- Underline. -->
  <rect x="9" y="20" width="14" height="1" fill="#000000"/>
</svg>
