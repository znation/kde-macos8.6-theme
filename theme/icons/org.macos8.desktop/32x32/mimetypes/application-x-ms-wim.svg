<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER: original WIM disk-image illustration pending user-approved artwork. -->
<!-- Platinum WIM disk-image icon, 32x32.

     Our own 32x32 drawing in the Platinum palette: a small window with a
     #000000 outline, a #DDDDDD title bar with a #FFFFFF highlight and one
     #999999 stripe and a #FFFFFF body, holding a black split image plate
     with notched corners cut by a white vertical gap, the split-volume
     mark. Drawn for this theme, not traced from anyone's artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Window outline. -->
  <rect x="3" y="5" width="26" height="22" fill="#000000"/>
  <!-- Title bar face. -->
  <rect x="4" y="6" width="24" height="4" fill="#DDDDDD"/>
  <!-- Title bar highlight. -->
  <rect x="4" y="6" width="24" height="1" fill="#FFFFFF"/>
  <!-- Title bar stripe. -->
  <rect x="6" y="8" width="20" height="1" fill="#999999"/>
  <!-- White body. -->
  <rect x="4" y="11" width="24" height="15" fill="#FFFFFF"/>
  <!-- Split image plate. -->
  <rect x="7" y="14" width="19" height="9" fill="#000000"/>
  <!-- Plate corner notches. -->
  <rect x="7" y="14" width="1" height="1" fill="#FFFFFF"/>
  <rect x="25" y="14" width="1" height="1" fill="#FFFFFF"/>
  <rect x="7" y="22" width="1" height="1" fill="#FFFFFF"/>
  <rect x="25" y="22" width="1" height="1" fill="#FFFFFF"/>
  <!-- Split-volume gap. -->
  <rect x="16" y="14" width="1" height="9" fill="#FFFFFF"/>
</svg>
