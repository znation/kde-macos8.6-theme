<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER: original gzip-archive illustration pending user-approved artwork. -->
<!-- Platinum gzip-archive icon, 32x32.

     Our own 32x32 drawing in the Platinum palette: the sealed package
     box (a black outline, a #DDDDDD lid band with a white top row, a
     white body and a grey tape stripe) holding a downward arrow on the
     white face, left of the tape. Drawn for this theme, not traced
     from anyone's artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Sealed package box, shared with package-x-generic. -->
  <rect x="3" y="6" width="26" height="22" fill="#000000"/>
  <rect x="4" y="7" width="24" height="3" fill="#DDDDDD"/>
  <rect x="4" y="7" width="24" height="1" fill="#FFFFFF"/>
  <rect x="4" y="10" width="24" height="17" fill="#FFFFFF"/>
  <rect x="15" y="10" width="2" height="17" fill="#999999"/>
  <!-- Downward arrow. -->
  <rect x="8" y="13" width="2" height="6" fill="#000000"/>
  <rect x="6" y="19" width="6" height="2" fill="#000000"/>
  <rect x="7" y="21" width="4" height="1" fill="#000000"/>
  <rect x="8" y="22" width="2" height="1" fill="#000000"/>
</svg>
