<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER: original Python-bytecode illustration pending user-approved artwork. -->
<!-- Platinum Python-bytecode icon, 32x32.

     Our own 32x32 drawing in the Platinum palette: a small window with a
     #000000 outline, a #DDDDDD title bar with a #FFFFFF highlight and one
     #999999 stripe, a #FFFFFF body and a black integrated-circuit chip
     (a body with three pins on the top edge and three on the bottom edge
     and one white notch dot inside the body), the machine-code mark.
     Drawn for this theme, not traced from anyone's artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Window outline. -->
  <rect x="3" y="5" width="26" height="22" fill="#000000"/>
  <!-- Title bar face. -->
  <rect x="4" y="6" width="24" height="4" fill="#DDDDDD"/>
  <!-- Title bar highlight. -->
  <rect x="4" y="6" width="24" height="1" fill="#FFFFFF"/>
  <!-- Title bar stripe. -->
  <rect x="6" y="8" width="20" height="1" fill="#999999"/>
  <!-- White body. -->
  <rect x="4" y="11" width="24" height="15" fill="#FFFFFF"/>
  <!-- Chip (machine-code mark), whole-pixel columns. -->
  <rect x="10" y="15" width="13" height="7" fill="#000000"/>
  <rect x="12" y="14" width="1" height="1" fill="#000000"/>
  <rect x="16" y="14" width="1" height="1" fill="#000000"/>
  <rect x="20" y="14" width="1" height="1" fill="#000000"/>
  <rect x="12" y="22" width="1" height="1" fill="#000000"/>
  <rect x="16" y="22" width="1" height="1" fill="#000000"/>
  <rect x="20" y="22" width="1" height="1" fill="#000000"/>
  <rect x="16" y="18" width="2" height="2" fill="#FFFFFF"/>
</svg>
