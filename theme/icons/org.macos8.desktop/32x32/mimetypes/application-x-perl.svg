<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER: original Perl-script illustration pending user-approved artwork. -->
<!-- Platinum Perl-script icon, 32x32.

     Our own 32x32 drawing in the Platinum palette: the generic document's
     page holding a black capital letter P (a full-height left stem and a
     closed upper bowl) on the white face, clear of the folded corner.
     Drawn for this theme, not traced from anyone's artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Page outline with the top-right corner cut away. -->
  <path d="M6 3 h14 l6 6 v20 H6 Z" fill="#000000"/>
  <!-- White page, inset one pixel. -->
  <path d="M7 4 h12 l6 6 v18 H7 Z" fill="#FFFFFF"/>
  <!-- Folded corner flap. -->
  <path d="M19 4 L25 4 L25 10 Z" fill="#DDDDDD"/>
  <!-- Capital P: full-height left stem. -->
  <rect x="10" y="11" width="2" height="13" fill="#000000"/>
  <!-- Capital P: bowl top. -->
  <rect x="12" y="11" width="5" height="1" fill="#000000"/>
  <!-- Capital P: bowl right. -->
  <rect x="16" y="12" width="1" height="5" fill="#000000"/>
  <!-- Capital P: bowl bottom. -->
  <rect x="12" y="16" width="5" height="1" fill="#000000"/>
</svg>
