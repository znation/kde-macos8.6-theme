<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER: original compiled-gettext-catalog illustration pending user-approved artwork. -->
<!-- Platinum compiled-gettext-catalog icon, 32x32.

     Our own 32x32 drawing in the Platinum palette: the document drawing
     (a #FFFFFF page with a 1px #000000 outline and a #DDDDDD folded
     top-right corner) with the text lines replaced by a black speech
     bubble with a square tail, its interior holding one white top bar
     longer than the white bottom bar — the catalog's translated lines
     being spoken. Drawn for this theme, not traced from anyone's
     artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Page outline with the top-right corner cut away. -->
  <path d="M6 3 h14 l6 6 v20 H6 Z" fill="#000000"/>
  <!-- White page, inset one pixel. -->
  <path d="M7 4 h12 l6 6 v18 H7 Z" fill="#FFFFFF"/>
  <!-- Folded corner flap. -->
  <path d="M19 4 L25 4 L25 10 Z" fill="#DDDDDD"/>
  <!-- Speech bubble, whole-pixel cells. -->
  <rect x="10" y="12" width="12" height="8" fill="#000000"/>
  <!-- Square tail. -->
  <rect x="11" y="20" width="2" height="2" fill="#000000"/>
  <!-- Translated-line bars. -->
  <rect x="12" y="14" width="8" height="1" fill="#FFFFFF"/>
  <rect x="12" y="16" width="5" height="1" fill="#FFFFFF"/>
</svg>
