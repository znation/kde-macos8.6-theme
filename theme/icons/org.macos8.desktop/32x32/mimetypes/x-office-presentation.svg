<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER: original office-presentation illustration pending user-approved artwork. -->
<!-- Platinum office-presentation icon, 32x32.

     Our own 32x32 drawing in the Platinum palette: the generic document's
     page (black outline, white page and folded corner) holding a slide
     with a black frame, a white field, a grey title band and three black
     bars of rising height. Drawn for this theme, not traced from anyone's
     artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Page outline with the top-right corner cut away. -->
  <path d="M6 3 h14 l6 6 v20 H6 Z" fill="#000000"/>
  <!-- White page, inset one pixel. -->
  <path d="M7 4 h12 l6 6 v18 H7 Z" fill="#FFFFFF"/>
  <!-- Folded corner flap. -->
  <path d="M19 4 L25 4 L25 10 Z" fill="#DDDDDD"/>
  <!-- Slide frame. -->
  <rect x="10" y="12" width="12" height="9" fill="#000000"/>
  <!-- Slide field. -->
  <rect x="11" y="13" width="10" height="7" fill="#FFFFFF"/>
  <!-- Title band. -->
  <rect x="11" y="13" width="10" height="2" fill="#DDDDDD"/>
  <!-- Bars of rising height. -->
  <rect x="12" y="17" width="2" height="2" fill="#000000"/>
  <rect x="15" y="16" width="2" height="3" fill="#000000"/>
  <rect x="18" y="15" width="2" height="4" fill="#000000"/>
</svg>
