<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 14 14">
  <!-- The Platinum mixed-state dash GTK loads for an indeterminate check box
       or radio. No reference screenshot shows a mixed-state control and GTK
       requires the :indeterminate state; the 2px square-capped black stroke
       reuses checkmark.svg's stroke, adapted from the desktop theme's
       widgets/checkmarks.svg. tests/test_gtk_theme.py::TestCheckGlyphs pins
       the path and the stroke. -->
  <path d="M 4,7 L 10,7" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="square"/>
</svg>
