<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 14 14">
  <!-- The Platinum check glyph GTK loads for a checked check box: the desktop
       theme's `widgets/checkmarks.svg` 2px black check adapted to this asset's
