<?xml version="1.0" encoding="UTF-8"?>
<!-- Mac OS 8.6 "Platinum" scroll bar.

     The bar PlasmaComponents.ScrollBar draws: the scroll bar used by
     PlasmaComponents.ScrollView, Menu, ComboBox and the clipboard applet.
     KSvg reads four prefixes: `background-vertical` and
     `background-horizontal` are the trough, a flat #EEEEEE bar with a 1px
     #000000 outline; `slider` and `mouseover-slider` are the handle, a raised
     #DDDDDD thumb with a 1px #000000 outline and a 1px bevel inside it
     (#FFFFFF on top/left, #999999 on bottom/right, the same bevel rule as
     button.svg's normal state). Corners are square.

     Two Plasma 6 deviations the artwork cannot change: ScrollBar.qml draws the
     trough (background-*) only while the pointer hovers the bar
     (`opacity: hovered && interactive`), and it computes but never uses
     `arrowPresent` (`//TODO: support arrows?`), so the Mac OS 8.6 arrow boxes
     at the trough ends cannot be drawn.

     Nine-slice contract: a 3px border around a 10px centre tile on a 16x16
     canvas; `hint-scrollbar-size` names the 16px track. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Nine-slice hints: tile size, track size and border margins. KSvg reads
       their geometry, not their colour. -->
  <rect id="hint-tile-center" x="3" y="3" width="10" height="10" style="fill:#ff6600"/>
  <rect id="hint-scrollbar-size" x="0" y="0" width="16" height="16" style="fill:#00ff00"/>
  <rect id="background-vertical-hint-top-margin" x="3" y="0" width="10" height="3" style="fill:#ff00ff"/>
  <rect id="background-vertical-hint-bottom-margin" x="3" y="13" width="10" height="3" style="fill:#ff00ff"/>
  <rect id="background-vertical-hint-left-margin" x="0" y="3" width="3" height="10" style="fill:#ff00ff"/>
  <rect id="background-vertical-hint-right-margin" x="13" y="3" width="3" height="10" style="fill:#ff00ff"/>
  <rect id="background-horizontal-hint-top-margin" x="3" y="0" width="10" height="3" style="fill:#ff00ff"/>
  <rect id="background-horizontal-hint-bottom-margin" x="3" y="13" width="10" height="3" style="fill:#ff00ff"/>
  <rect id="background-horizontal-hint-left-margin" x="0" y="3" width="3" height="10" style="fill:#ff00ff"/>
  <rect id="background-horizontal-hint-right-margin" x="13" y="3" width="3" height="10" style="fill:#ff00ff"/>
  <rect id="slider-hint-top-margin" x="3" y="0" width="10" height="3" style="fill:#ff00ff"/>
  <rect id="slider-hint-bottom-margin" x="3" y="13" width="10" height="3" style="fill:#ff00ff"/>
  <rect id="slider-hint-left-margin" x="0" y="3" width="3" height="10" style="fill:#ff00ff"/>
  <rect id="slider-hint-right-margin" x="13" y="3" width="3" height="10" style="fill:#ff00ff"/>
  <rect id="mouseover-slider-hint-top-margin" x="3" y="0" width="10" height="3" style="fill:#ff00ff"/>
  <rect id="mouseover-slider-hint-bottom-margin" x="3" y="13" width="10" height="3" style="fill:#ff00ff"/>
  <rect id="mouseover-slider-hint-left-margin" x="0" y="3" width="3" height="10" style="fill:#ff00ff"/>
  <rect id="mouseover-slider-hint-right-margin" x="13" y="3" width="3" height="10" style="fill:#ff00ff"/>

  <!-- Trough: a flat #EEEEEE bar with a 1px #000000 outline, identical for the
       vertical and horizontal bars. -->
  <g id="background-vertical-top" transform="translate(3,0)">
    <rect width="10" height="3" fill="#EEEEEE"/>
    <rect y="0" width="10" height="1" fill="#000000"/>
  </g>
  <g id="background-vertical-bottom" transform="translate(3,13)">
    <rect width="10" height="3" fill="#EEEEEE"/>
    <rect y="2" width="10" height="1" fill="#000000"/>
  </g>
  <g id="background-vertical-left" transform="translate(0,3)">
    <rect width="3" height="10" fill="#EEEEEE"/>
    <rect x="0" width="1" height="10" fill="#000000"/>
  </g>
  <g id="background-vertical-right" transform="translate(13,3)">
    <rect width="3" height="10" fill="#EEEEEE"/>
    <rect x="2" width="1" height="10" fill="#000000"/>
  </g>
  <g id="background-vertical-center" transform="translate(3,3)">
    <rect width="10" height="10" fill="#EEEEEE"/>
  </g>
  <g id="background-vertical-topleft">
    <rect width="3" height="3" fill="#EEEEEE"/>
    <rect width="3" height="1" fill="#000000"/>
    <rect width="1" height="3" fill="#000000"/>
  </g>
  <g id="background-vertical-topright" transform="translate(13,0)">
    <rect width="3" height="3" fill="#EEEEEE"/>
    <rect width="3" height="1" fill="#000000"/>
    <rect x="2" width="1" height="3" fill="#000000"/>
  </g>
  <g id="background-vertical-bottomleft" transform="translate(0,13)">
    <rect width="3" height="3" fill="#EEEEEE"/>
    <rect y="2" width="3" height="1" fill="#000000"/>
    <rect width="1" height="3" fill="#000000"/>
  </g>
  <g id="background-vertical-bottomright" transform="translate(13,13)">
    <rect width="3" height="3" fill="#EEEEEE"/>
    <rect y="2" width="3" height="1" fill="#000000"/>
    <rect x="2" width="1" height="3" fill="#000000"/>
  </g>

  <g id="background-horizontal-top" transform="translate(3,0)">
    <rect width="10" height="3" fill="#EEEEEE"/>
    <rect y="0" width="10" height="1" fill="#000000"/>
  </g>
  <g id="background-horizontal-bottom" transform="translate(3,13)">
    <rect width="10" height="3" fill="#EEEEEE"/>
    <rect y="2" width="10" height="1" fill="#000000"/>
  </g>
  <g id="background-horizontal-left" transform="translate(0,3)">
    <rect width="3" height="10" fill="#EEEEEE"/>
    <rect x="0" width="1" height="10" fill="#000000"/>
  </g>
  <g id="background-horizontal-right" transform="translate(13,3)">
    <rect width="3" height="10" fill="#EEEEEE"/>
    <rect x="2" width="1" height="10" fill="#000000"/>
  </g>
  <g id="background-horizontal-center" transform="translate(3,3)">
    <rect width="10" height="10" fill="#EEEEEE"/>
  </g>
  <g id="background-horizontal-topleft">
    <rect width="3" height="3" fill="#EEEEEE"/>
    <rect width="3" height="1" fill="#000000"/>
    <rect width="1" height="3" fill="#000000"/>
  </g>
  <g id="background-horizontal-topright" transform="translate(13,0)">
    <rect width="3" height="3" fill="#EEEEEE"/>
    <rect width="3" height="1" fill="#000000"/>
    <rect x="2" width="1" height="3" fill="#000000"/>
  </g>
  <g id="background-horizontal-bottomleft" transform="translate(0,13)">
    <rect width="3" height="3" fill="#EEEEEE"/>
    <rect y="2" width="3" height="1" fill="#000000"/>
    <rect width="1" height="3" fill="#000000"/>
  </g>
  <g id="background-horizontal-bottomright" transform="translate(13,13)">
    <rect width="3" height="3" fill="#EEEEEE"/>
    <rect y="2" width="3" height="1" fill="#000000"/>
    <rect x="2" width="1" height="3" fill="#000000"/>
  </g>

  <!-- Handle: a raised #DDDDDD thumb with a 1px #000000 outline and a 1px
       bevel inside it (#FFFFFF top/left, #999999 bottom/right). The hovered
       state is pixel-identical to the normal one. -->
  <g id="slider-top" transform="translate(3,0)">
    <rect width="10" height="3" fill="#DDDDDD"/>
    <rect y="1" width="10" height="1" fill="#FFFFFF"/>
    <rect y="0" width="10" height="1" fill="#000000"/>
  </g>
  <g id="slider-bottom" transform="translate(3,13)">
    <rect width="10" height="3" fill="#DDDDDD"/>
    <rect y="1" width="10" height="1" fill="#999999"/>
    <rect y="2" width="10" height="1" fill="#000000"/>
  </g>
  <g id="slider-left" transform="translate(0,3)">
    <rect width="3" height="10" fill="#DDDDDD"/>
    <rect x="1" width="1" height="10" fill="#FFFFFF"/>
    <rect x="0" width="1" height="10" fill="#000000"/>
  </g>
  <g id="slider-right" transform="translate(13,3)">
    <rect width="3" height="10" fill="#DDDDDD"/>
    <rect x="1" width="1" height="10" fill="#999999"/>
    <rect x="2" width="1" height="10" fill="#000000"/>
  </g>
  <g id="slider-center" transform="translate(3,3)">
    <rect width="10" height="10" fill="#DDDDDD"/>
  </g>
  <g id="slider-topleft">
    <rect width="3" height="3" fill="#DDDDDD"/>
    <rect y="1" width="3" height="1" fill="#FFFFFF"/>
    <rect x="1" width="1" height="3" fill="#FFFFFF"/>
    <rect y="0" width="3" height="1" fill="#000000"/>
    <rect x="0" width="1" height="3" fill="#000000"/>
  </g>
  <g id="slider-topright" transform="translate(13,0)">
    <rect width="3" height="3" fill="#DDDDDD"/>
    <rect y="1" width="3" height="1" fill="#FFFFFF"/>
    <rect x="1" width="1" height="3" fill="#999999"/>
    <rect y="0" width="3" height="1" fill="#000000"/>
    <rect x="2" width="1" height="3" fill="#000000"/>
  </g>
  <g id="slider-bottomleft" transform="translate(0,13)">
    <rect width="3" height="3" fill="#DDDDDD"/>
    <rect y="1" width="3" height="1" fill="#999999"/>
    <rect x="1" width="1" height="3" fill="#FFFFFF"/>
    <rect y="2" width="3" height="1" fill="#000000"/>
    <rect x="0" width="1" height="3" fill="#000000"/>
  </g>
  <g id="slider-bottomright" transform="translate(13,13)">
    <rect width="3" height="3" fill="#DDDDDD"/>
    <rect y="1" width="3" height="1" fill="#999999"/>
    <rect x="1" width="1" height="3" fill="#999999"/>
    <rect y="2" width="3" height="1" fill="#000000"/>
    <rect x="2" width="1" height="3" fill="#000000"/>
  </g>

  <g id="mouseover-slider-top" transform="translate(3,0)">
    <rect width="10" height="3" fill="#DDDDDD"/>
    <rect y="1" width="10" height="1" fill="#FFFFFF"/>
    <rect y="0" width="10" height="1" fill="#000000"/>
  </g>
  <g id="mouseover-slider-bottom" transform="translate(3,13)">
    <rect width="10" height="3" fill="#DDDDDD"/>
    <rect y="1" width="10" height="1" fill="#999999"/>
    <rect y="2" width="10" height="1" fill="#000000"/>
  </g>
  <g id="mouseover-slider-left" transform="translate(0,3)">
    <rect width="3" height="10" fill="#DDDDDD"/>
    <rect x="1" width="1" height="10" fill="#FFFFFF"/>
    <rect x="0" width="1" height="10" fill="#000000"/>
  </g>
  <g id="mouseover-slider-right" transform="translate(13,3)">
    <rect width="3" height="10" fill="#DDDDDD"/>
    <rect x="1" width="1" height="10" fill="#999999"/>
    <rect x="2" width="1" height="10" fill="#000000"/>
  </g>
  <g id="mouseover-slider-center" transform="translate(3,3)">
    <rect width="10" height="10" fill="#DDDDDD"/>
  </g>
  <g id="mouseover-slider-topleft">
    <rect width="3" height="3" fill="#DDDDDD"/>
    <rect y="1" width="3" height="1" fill="#FFFFFF"/>
    <rect x="1" width="1" height="3" fill="#FFFFFF"/>
    <rect y="0" width="3" height="1" fill="#000000"/>
    <rect x="0" width="1" height="3" fill="#000000"/>
  </g>
  <g id="mouseover-slider-topright" transform="translate(13,0)">
    <rect width="3" height="3" fill="#DDDDDD"/>
    <rect y="1" width="3" height="1" fill="#FFFFFF"/>
    <rect x="1" width="1" height="3" fill="#999999"/>
    <rect y="0" width="3" height="1" fill="#000000"/>
    <rect x="2" width="1" height="3" fill="#000000"/>
  </g>
  <g id="mouseover-slider-bottomleft" transform="translate(0,13)">
    <rect width="3" height="3" fill="#DDDDDD"/>
    <rect y="1" width="3" height="1" fill="#999999"/>
    <rect x="1" width="1" height="3" fill="#FFFFFF"/>
    <rect y="2" width="3" height="1" fill="#000000"/>
    <rect x="0" width="1" height="3" fill="#000000"/>
  </g>
  <g id="mouseover-slider-bottomright" transform="translate(13,13)">
    <rect width="3" height="3" fill="#DDDDDD"/>
    <rect y="1" width="3" height="1" fill="#999999"/>
    <rect x="1" width="1" height="3" fill="#999999"/>
    <rect y="2" width="3" height="1" fill="#000000"/>
    <rect x="2" width="1" height="3" fill="#000000"/>
  </g>
</svg>
