<?xml version="1.0" encoding="UTF-8"?>
<!-- Mac OS 8.6 "Platinum" virtual-desktop pager cell.

     The optional Pager (org.kde.plasma.pager; org.kde.plasma.activitypager
     shares its QML through X-Plasma-RootPath) draws every virtual-desktop
     cell with KSvg.FrameSvgItem imagePath: "widgets/pager" in
     contents/ui/main.qml, one frame per prefix "normal", "hover" and
     "active". Without this file KSvg falls back to Breeze's pager frames, so
     all three prefixes ship here and there is no cross-theme fallback.

     No reference screenshot shows a virtual-desktop pager; the three prefixes
     are KDE-required, the 12x9 tile is this theme's own, the centre opacities
     are the installed default theme's (hover 0.2, active 0.6), and the colours
     reuse the grounded Platinum bevel, trough, outline and selection anchors.
     `normal` outlines an idle desktop in #999999, `hover` washes the pale
     #EEEEEE view trough over it, and `active` washes the current desktop with
     the #CCCCFF selection. The Pager draws each desktop's window previews in
     `clipRect` at z:1, below these frames (z:2-4), so a centre fill must stay
     translucent or it hides the preview on the hovered and current desktops;
     the 1px borders sit outside that inset preview. The normal centre is a
     transparent 0.01-opacity placeholder that only carries the margins (a
     nine-slice element with no rendered content has no bounding box for KSvg
     to read margins from).

     The nine-slice contract is a 1px border around a 10x7 centre tile on a
     tight 12x9 canvas. -->
<svg xmlns="http://www.w3.org/2000/svg" width="12" height="9" viewBox="0 0 12 9">
  <!-- Nine-slice hints: tile size and border margins. KSvg reads their
       geometry, not their colour. -->
  <rect id="hint-tile-center" x="1" y="1" width="10" height="7" style="fill:#ff6600"/>
  <rect id="normal-hint-top-margin" x="1" y="0" width="10" height="1" style="fill:#ff00ff"/>
  <rect id="normal-hint-bottom-margin" x="1" y="8" width="10" height="1" style="fill:#ff00ff"/>
  <rect id="normal-hint-left-margin" x="0" y="1" width="1" height="7" style="fill:#ff00ff"/>
  <rect id="normal-hint-right-margin" x="11" y="1" width="1" height="7" style="fill:#ff00ff"/>
  <rect id="hover-hint-top-margin" x="1" y="0" width="10" height="1" style="fill:#ff00ff"/>
  <rect id="hover-hint-bottom-margin" x="1" y="8" width="10" height="1" style="fill:#ff00ff"/>
  <rect id="hover-hint-left-margin" x="0" y="1" width="1" height="7" style="fill:#ff00ff"/>
  <rect id="hover-hint-right-margin" x="11" y="1" width="1" height="7" style="fill:#ff00ff"/>
  <rect id="active-hint-top-margin" x="1" y="0" width="10" height="1" style="fill:#ff00ff"/>
  <rect id="active-hint-bottom-margin" x="1" y="8" width="10" height="1" style="fill:#ff00ff"/>
  <rect id="active-hint-left-margin" x="0" y="1" width="1" height="7" style="fill:#ff00ff"/>
  <rect id="active-hint-right-margin" x="11" y="1" width="1" height="7" style="fill:#ff00ff"/>

  <!-- Normal: an idle desktop is a thin #999999 outline around the panel
       face, so only the eight border tiles paint. -->
  <g id="normal-top" transform="translate(1,0)">
    <rect width="10" height="1" fill="#999999"/>
  </g>
  <g id="normal-bottom" transform="translate(1,8)">
    <rect width="10" height="1" fill="#999999"/>
  </g>
  <g id="normal-left" transform="translate(0,1)">
    <rect width="1" height="7" fill="#999999"/>
  </g>
  <g id="normal-right" transform="translate(11,1)">
    <rect width="1" height="7" fill="#999999"/>
  </g>
  <g id="normal-center" transform="translate(1,1)">
    <rect width="10" height="7" style="fill:#FFFFFF" fill-opacity="0.01"/>
  </g>
  <g id="normal-topleft">
    <rect width="1" height="1" fill="#999999"/>
  </g>
  <g id="normal-topright" transform="translate(11,0)">
    <rect width="1" height="1" fill="#999999"/>
  </g>
  <g id="normal-bottomleft" transform="translate(0,8)">
    <rect width="1" height="1" fill="#999999"/>
  </g>
  <g id="normal-bottomright" transform="translate(11,8)">
    <rect width="1" height="1" fill="#999999"/>
  </g>

  <!-- Hover: the same outline around a translucent #EEEEEE wash over the
       window previews. -->
  <g id="hover-top" transform="translate(1,0)">
    <rect width="10" height="1" fill="#999999"/>
  </g>
  <g id="hover-bottom" transform="translate(1,8)">
    <rect width="10" height="1" fill="#999999"/>
  </g>
  <g id="hover-left" transform="translate(0,1)">
    <rect width="1" height="7" fill="#999999"/>
  </g>
  <g id="hover-right" transform="translate(11,1)">
    <rect width="1" height="7" fill="#999999"/>
  </g>
  <g id="hover-center" transform="translate(1,1)">
    <rect width="10" height="7" fill="#EEEEEE" fill-opacity="0.2"/>
  </g>
  <g id="hover-topleft">
    <rect width="1" height="1" fill="#999999"/>
  </g>
  <g id="hover-topright" transform="translate(11,0)">
    <rect width="1" height="1" fill="#999999"/>
  </g>
  <g id="hover-bottomleft" transform="translate(0,8)">
    <rect width="1" height="1" fill="#999999"/>
  </g>
  <g id="hover-bottomright" transform="translate(11,8)">
    <rect width="1" height="1" fill="#999999"/>
  </g>

  <!-- Active: a black outline around a translucent #CCCCFF selection wash
       over the window previews. -->
  <g id="active-top" transform="translate(1,0)">
    <rect width="10" height="1" fill="#000000"/>
  </g>
  <g id="active-bottom" transform="translate(1,8)">
    <rect width="10" height="1" fill="#000000"/>
  </g>
  <g id="active-left" transform="translate(0,1)">
    <rect width="1" height="7" fill="#000000"/>
  </g>
  <g id="active-right" transform="translate(11,1)">
    <rect width="1" height="7" fill="#000000"/>
  </g>
  <g id="active-center" transform="translate(1,1)">
    <rect width="10" height="7" fill="#CCCCFF" fill-opacity="0.6"/>
  </g>
  <g id="active-topleft">
    <rect width="1" height="1" fill="#000000"/>
  </g>
  <g id="active-topright" transform="translate(11,0)">
    <rect width="1" height="1" fill="#000000"/>
  </g>
  <g id="active-bottomleft" transform="translate(0,8)">
    <rect width="1" height="1" fill="#000000"/>
  </g>
  <g id="active-bottomright" transform="translate(11,8)">
    <rect width="1" height="1" fill="#000000"/>
  </g>
</svg>
