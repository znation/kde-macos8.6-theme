    <rect x="96" y="32" width="16" height="32" fill="none"/>
    <path d="M 99,37 L 109,37 M 99,37 L 99,47 M 99,48 L 109,48 M 99,49 L 99,59 M 99,59 L 109,59 M 109,49 L 109,59" fill="none" stroke="#CC0000"
