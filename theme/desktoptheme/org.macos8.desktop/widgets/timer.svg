    <path d="M 131,37 L 141,37 M 141,37 L 141,47 M 141,49 L 141,59 M 131,59 L 141,59 M 131,49 L 131,59 M 131,37 L 131,47 M 131,48 L 141,48" fill="none" stroke="#CC0000"
          stroke-width="2" stroke-linecap="square"/>
  </g>
  <!-- Digit 9, alert state (the "_1" suffix): 16x32 cell at (144, 32). -->
  <g id="9_1">
    <rect x="144" y="32" width="16" height="32" fill="none"/>
    <path d="M 147,37 L 157,37 M 157,37 L 157,47 M 147,37 L 147,47 M 147,48 L 157,48 M 157,49 L 157,59 M 147,59 L 157,59" fill="none" stroke="#CC0000"
          stroke-width="2" stroke-linecap="square"/>
  </g>
  <!-- Colon separator, normal state: 8x32 cell at (160, 0). -->
  <g id="separator">
    <rect x="160" y="0" width="8" height="32" fill="none"/>
    <circle cx="164" cy="10" r="1.5" fill="#000000"/>
    <circle cx="164" cy="22" r="1.5" fill="#000000"/>
  </g>
  <!-- Digit 0, alert state (the "_1" suffix): 16x32 cell at (0, 32). -->
  <!-- Colon separator, alert state: 8x32 cell at (160, 32). -->
  <g id="separator_1">
    <rect x="160" y="32" width="8" height="32" fill="none"/>
