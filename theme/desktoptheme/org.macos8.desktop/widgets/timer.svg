    <rect x="48" y="32" width="16" height="32" fill="none"/>
    <path d="M 51,37 L 61,37 M 61,37 L 61,47 M 51,48 L 61,48 M 61,49 L 61,59 M 51,59 L 61,59" fill="none" stroke="#CC0000"
          stroke-width="2" stroke-linecap="square"/>
  </g>
  <!-- Digit 4, alert state (the "_1" suffix): 16x32 cell at (64, 32). -->
