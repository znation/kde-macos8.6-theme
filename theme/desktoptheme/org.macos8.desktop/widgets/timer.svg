<?xml version="1.0" encoding="UTF-8"?>
<!-- Timer plasmoid LCD digits for the Mac OS 8.6 "Platinum" theme.

     Consumer: org.kde.plasma.timer, whose TimerEdit.qml draws every
     edit digit as a KSvg.SvgItem with imagePath "widgets/timer" and
     elementId num + digitSuffix or "separator" + digitSuffix, where
     digitSuffix is empty normally and "_1" in alert mode (a running
     countdown with under a minute left). That suffix split makes the
     twenty-two KDE-required ids below: the ten digits 0 to 9, their
     ten "_1" alert variants, and separator, separator_1. The default
     theme's extra separatorB and separatorC ids are legacy this
     plasmoid never requests, so they are not shipped.

     Provenance: no reference screenshot shows a KDE timer (nor Mac OS
     8.6's countdown equivalent), so this artwork is a
     platform-required adaptation. The seven-segment geometry is this
     theme's own choice: each digit is a stroke-only path in a 16x32
     cell with a 2px square-capped stroke, drawn per the flat
     black-glyph recipe of widgets/checkmarks.svg. The two colours
     reuse the colour scheme's semantic tokens: the normal digits
     stroke #000000 from [Colors:Tooltip] ForegroundNormal=0,0,0 and
     the alert digits stroke #CC0000 from ForegroundNegative=204,0,0
     (theme/color-schemes/MacOS8.colors).
     -->
<svg xmlns="http://www.w3.org/2000/svg" width="168" height="64" viewBox="0 0 168 64">
  <!-- Digit 0, normal state: 16x32 cell at (0, 0). -->
  <g id="0">
    <rect x="0" y="0" width="16" height="32" fill="none"/>
    <path d="M 3,5 L 13,5 M 13,5 L 13,15 M 13,17 L 13,27 M 3,27 L 13,27 M 3,17 L 3,27 M 3,5 L 3,15" fill="none" stroke="#000000"
          stroke-width="2" stroke-linecap="square"/>
  </g>
  <!-- Digit 1, normal state: 16x32 cell at (16, 0). -->
  <g id="1">
    <rect x="16" y="0" width="16" height="32" fill="none"/>
    <path d="M 29,5 L 29,15 M 29,17 L 29,27" fill="none" stroke="#000000"
          stroke-width="2" stroke-linecap="square"/>
  </g>
  <!-- Digit 2, normal state: 16x32 cell at (32, 0). -->
  <g id="2">
    <rect x="32" y="0" width="16" height="32" fill="none"/>
    <path d="M 35,5 L 45,5 M 45,5 L 45,15 M 35,16 L 45,16 M 35,17 L 35,27 M 35,27 L 45,27" fill="none" stroke="#000000"
          stroke-width="2" stroke-linecap="square"/>
  </g>
  <!-- Digit 3, normal state: 16x32 cell at (48, 0). -->
  <g id="3">
    <rect x="48" y="0" width="16" height="32" fill="none"/>
    <path d="M 51,5 L 61,5 M 61,5 L 61,15 M 51,16 L 61,16 M 61,17 L 61,27 M 51,27 L 61,27" fill="none" stroke="#000000"
          stroke-width="2" stroke-linecap="square"/>
  </g>
  <!-- Digit 4, normal state: 16x32 cell at (64, 0). -->
  <g id="4">
    <rect x="64" y="0" width="16" height="32" fill="none"/>
    <path d="M 67,5 L 67,15 M 67,16 L 77,16 M 77,5 L 77,15 M 77,17 L 77,27" fill="none" stroke="#000000"
          stroke-width="2" stroke-linecap="square"/>
  </g>
  <!-- Digit 5, normal state: 16x32 cell at (80, 0). -->
  <g id="5">
    <rect x="80" y="0" width="16" height="32" fill="none"/>
    <path d="M 83,5 L 93,5 M 83,5 L 83,15 M 83,16 L 93,16 M 93,17 L 93,27 M 83,27 L 93,27" fill="none" stroke="#000000"
